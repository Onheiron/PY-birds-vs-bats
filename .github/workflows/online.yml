name: Online

# The leaderboards' backend (src/services/online.py): replay the games players sent and put
# the true ones on the leaderboards (tools/verify_runs.py). A run watches for 5h30, checking
# every minute, then starts the next one itself (GitHub's schedule alone is unreliable: it
# can skip hours); the schedule only restarts the chain if it ever breaks. Only one run at a
# time (concurrency). By hand: verify, deploy the Firestore rules (firestore.rules), or wipe.
# Needs the secret FIREBASE_SERVICE_ACCOUNT (the service account's JSON).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "verify, rules or wipe (wipe deletes every document)"
        type: choice
        options: [verify, rules, wipe]
        default: verify

permissions:
  contents: write  # the verified games are archived as release assets (recordings-YYYY-Www)
  actions: write  # a watch starts the next one

concurrency:
  group: online
  cancel-in-progress: false  # a new run waits for the watch running (one waits at most)

jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # a watch is 330 minutes; GitHub stops jobs at 360
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ inputs.action || 'verify' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags: every game is replayed with its version's code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt firebase-admin
      - name: Verify the games sent
        if: env.ACTION == 'verify'
        run: SDL_AUDIODRIVER=dummy python tools/verify_runs.py verify --watch 330
      - name: Start the next watch
        if: env.ACTION == 'verify' && always()
        run: gh workflow run online.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f action=verify
      - name: Wipe the database
        if: env.ACTION == 'wipe'
        run: python tools/verify_runs.py wipe --yes
      - name: Deploy the Firestore rules
        if: env.ACTION == 'rules'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project birds-vs-bats --non-interactive
