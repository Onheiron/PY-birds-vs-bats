name: Release

# Push a tag like v2.1.0 (matching __version__ in src/__init__.py) to publish a
# GitHub release with the desktop builds (macOS app, Windows and Linux, each
# opening its own window) and the Steam Linux build. Or run it by hand with "publish": it tags the commit
# v<__version__> and publishes the release itself.
#
# Published with it (see docs/publishing.md):
# - PyPI (pip install birds-vs-bats), by trusted publishing (the project on
#   pypi.org trusts this workflow, environment "pypi") or with the secret
#   PYPI_API_TOKEN;
# - itch.io, with butler, when the repository has the variable ITCH_GAME
#   ("user/game") and the secret BUTLER_API_KEY.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag this commit v<version> and publish the release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Read version
        id: version
        run: echo "version=$(python game.py --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Tag must match the code version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${{ steps.version.outputs.version }} (src/__init__.py)"
            exit 1
          fi
      - run: ruff check .
      - run: python -m pytest

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            smoke: dist/BVB/BVB
          - os: macos-latest
            name: macos-arm64
            smoke: dist/BVB.app/Contents/MacOS/BVB
          - os: windows-latest
            name: windows-x86_64
            smoke: dist/BVB/BVB.exe
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Bundle sound support
        run: pip install numpy pygame-ce
      - name: Build the desktop app (it opens its own window)
        run: pyinstaller --noconfirm packaging/BVB.spec
      - name: Smoke test the build
        run: python tools/smoke_test_binary.py ${{ matrix.smoke }} --windowed
      - name: Package
        shell: bash
        run: |
          name="BVB-${{ needs.verify.outputs.version }}-${{ matrix.name }}"
          mkdir "$name"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R dist/BVB.app "$name/"
          else
            cp -R dist/BVB/. "$name/"
          fi
          cp README.md config.sample.yml hardmode.yml "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BVB-${{ matrix.name }}
          path: |
            BVB-*.tar.gz
            BVB-*.zip
          if-no-files-found: error

  steam-linux:
    name: Build Steam Linux depot (Steam Linux Runtime 3)
    needs: verify
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v5
      - name: Build in the Steam Runtime
        run: packaging/steam/build-linux.sh --inside
      - uses: actions/upload-artifact@v4
        with:
          name: BVB-steam-linux
          path: dist/BVB-*-steam-linux.tar.gz
          if-no-files-found: error

  pip:
    name: Build the pip package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install it and smoke test the bvb command
        run: |
          python -m venv /tmp/bvb
          /tmp/bvb/bin/pip install dist/*.whl
          python tools/smoke_test_binary.py /tmp/bvb/bin/bvb
      - uses: actions/upload-artifact@v4
        with:
          name: BVB-pip
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, build, steam-linux, pip]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum BVB-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: BVB ${{ needs.verify.outputs.version }}
          # Run by hand: the tag is created on this commit
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.verify.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*

  pypi:
    name: Publish to PyPI
    needs: [verify, publish]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BVB-pip
          path: dist
      # Trusted publishing; or, if the repository has the secret PYPI_API_TOKEN, that token
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true  # a version already on PyPI (uploaded by hand) is not an error

  itch:
    name: Publish to itch.io
    needs: [verify, publish]
    if: vars.ITCH_GAME != ''
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Get butler
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Unpack one folder per channel
        run: |
          mkdir -p itch/linux itch/mac itch/windows
          tar -xzf artifacts/BVB-$VERSION-steam-linux.tar.gz -C itch/linux --strip-components=1
          tar -xzf artifacts/BVB-$VERSION-macos-arm64.tar.gz -C itch/mac --strip-components=1
          unzip -q artifacts/BVB-$VERSION-windows-x86_64.zip -d itch/windows-tmp
          mv itch/windows-tmp/*/* itch/windows/
      - name: Push
        run: |
          for channel in linux mac windows; do
            butler/butler push "itch/$channel" "${{ vars.ITCH_GAME }}:$channel" --userversion "$VERSION"
          done
