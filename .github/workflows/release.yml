name: Release

# Push a tag like v2.1.0 (matching __version__ in src/__init__.py) to publish a
# GitHub release with standalone binaries for Linux, macOS and Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Read version
        id: version
        run: echo "version=$(python game.py --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Tag must match the code version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${{ steps.version.outputs.version }} (src/__init__.py)"
            exit 1
          fi
      - run: ruff check .
      - run: python -m pytest

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            binary: BVB
          - os: macos-latest
            name: macos-arm64
            binary: BVB
          - os: windows-latest
            name: windows-x86_64
            binary: BVB.exe
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Bundle sound support
        run: pip install numpy sounddevice
      - name: Build standalone binary
        run: pyinstaller --noconfirm packaging/BVB.spec
      - name: Smoke test the binary
        run: python tools/smoke_test_binary.py dist/${{ matrix.binary }}
      - name: Package
        shell: bash
        run: |
          name="BVB-${{ needs.verify.outputs.version }}-${{ matrix.name }}"
          mkdir "$name"
          cp "dist/${{ matrix.binary }}" README.md config.sample.yml hardmode.yml "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BVB-${{ matrix.name }}
          path: |
            BVB-*.tar.gz
            BVB-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum BVB-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: BVB ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
