# BVB (Birds vs Bats) - PEACEFUL Difficulty Configuration
# Very relaxed settings for casual play - rare birds are extremely rare
# Selected from the title screen (NEW GAME < difficulty >), or directly with:
#   python3 game.py --config config_easy.yml

# Only override values that differ from config.yml (ADVENTURE)

game:
  difficulty_name: "PEACEFUL"
  life_recovery_on_spawn: true  # Lives recovered when new birds spawn

bat_enemy:
  # Lower HP - bats die faster
  hp_by_tier:
    1: 120      # ADVENTURE: 240
    2: 240      # ADVENTURE: 480
    3: 480      # ADVENTURE: 960
    4: 960      # ADVENTURE: 1920
  # Bats per world (PEACEFUL: about half of ADVENTURE, slower, lower tiers); a list replaces the whole of config.yml's, see
  # bat_enemy.worlds there for what each field means
  worlds:
    - {max_bats: 0, spawn_interval: 0, tiers: [0, 0, 0, 0], kinds: {}, height: [3, 8], dive_height: [0.05, 0.20], mini_bat: 0.05}
    - {max_bats: 1, spawn_interval: 180, tiers: [85, 15, 0, 0], kinds: {diver: 0.04},
       height: [3, 8], dive_height: [0.08, 0.25], mini_bat: 0.1}
    - {max_bats: 2, spawn_interval: 150, tiers: [65, 30, 5, 0], kinds: {armored: 0.04, diver: 0.05, spellcaster: 0.03, healer: 0.03},
       height: [5, 12], dive_height: [0.1, 0.3], mini_bat: 0.15}
    - {max_bats: 2, spawn_interval: 135, tiers: [50, 35, 13, 2], kinds: {armored: 0.05, diver: 0.06, spellcaster: 0.04, healer: 0.03, bomber: 0.04, plague: 0.03},
       height: [8, 16], dive_height: [0.12, 0.35], mini_bat: 0.2}
    - {max_bats: 3, spawn_interval: 110, tiers: [35, 40, 20, 5], kinds: {armored: 0.07, diver: 0.06, spellcaster: 0.05, healer: 0.04, bomber: 0.05, plague: 0.04, necromancer: 0.02},
       height: [10, 20], dive_height: [0.15, 0.4], mini_bat: 0.25}
    - {max_bats: 3, spawn_interval: 90, tiers: [20, 40, 30, 10], kinds: {armored: 0.1, diver: 0.07, spellcaster: 0.06, healer: 0.04, bomber: 0.05, plague: 0.05, necromancer: 0.04},
       height: [12, 23], dive_height: [0.18, 0.45], mini_bat: 0.3}

obstacle:
  # Lower HP - obstacles break faster
  hp_by_tier:
    1: 30       # ADVENTURE: 50
    2: 50       # ADVENTURE: 80
    3: 100      # ADVENTURE: 160
    4: 200      # ADVENTURE: 320
  # Slower spawn rate
  spawning:
    biome_base: 60           # ADVENTURE: 40 (higher = slower spawn)
    biome_decay: 0.90        # ADVENTURE: 0.85
    sublevel_decay: 0.95     # ADVENTURE: 0.9
    min_spawn_rate: 12       # ADVENTURE: 6

# Eggs - rare birds are MUCH rarer in PEACEFUL
# NOTE: the egg (and loot) tables below are NOT applied when the difficulty is
# picked from the title screen: they were written for the old four-rarity loot
# system and do not match the six rarities of config.yml. See DIFFICULTY_SECTIONS
# in src/core/constants.py.
eggs:
  rarity_candidates:
    common:
      yellow_egg: 45         # More common birds
      red_egg: 30
      blue_egg: 20
      patchwork_egg: 4       # Rarer
      purple_egg: 1          # Very rare
    uncommon:
      blue_egg: 50           # More common
      patchwork_egg: 30
      purple_egg: 15
      clockwork_egg: 4       # Rare
      stealth_egg: 1         # Very rare
      cookie_egg: 0          # Essentially unavailable
    rare:
      white_egg: 60          # More common of the rares
      orange_egg: 35
      gold_egg: 5            # Very rare
    epic:
      dinosaur_egg: 1        # Virtually impossible
      glitch_egg: 1          # Virtually impossible

progression:
  # Faster grade progression - birds level up slower
  grade_exp_factor: 1.2      # ADVENTURE: 1.07 (lower = faster leveling)

speed:
  # Lower momentum threshold - easier to gain momentum
  momentum_zero_height: 0.25  # ADVENTURE: 0.33 (lower = easier)
  momentum_gain_multiplier: 115.0  # ADVENTURE: 90 (faster gears)
