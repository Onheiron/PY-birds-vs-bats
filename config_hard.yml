# BVB (Birds vs Bats) - HARD Difficulty Configuration
# Challenging settings for experienced players
# Use with: python -m src.game --config config_hard.yml

# Only override values that differ from config.yml (NORMAL)

bat_enemy:
  # Higher HP - bats take more hits
  hp_by_tier:
    1: 36      # NORMAL: 24
    2: 72      # NORMAL: 48
    3: 144     # NORMAL: 96
    4: 288     # NORMAL: 192
  # More bats on screen
  max_on_screen: 7    # NORMAL: 5
  # Faster spawn rate (lower = more frequent)
  spawn_interval_range: [50, 100]  # NORMAL: [80, 160]
  spawn_rate_by_level:
    level_4_6: 140    # NORMAL: 200
    level_7_9: 100    # NORMAL: 150
    level_10_12: 70   # NORMAL: 100
    level_13_15: 50   # NORMAL: 70
    level_16_18: 35   # NORMAL: 50
  max_bats_by_level:
    level_4_6: 2      # NORMAL: 1
    level_7_9: 3      # NORMAL: 2
    level_10_12: 4    # NORMAL: 3
    level_13_15: 5    # NORMAL: 4
    level_16_18: 7    # NORMAL: 5
  tiers:
    hp_tier_1: 36
    hp_tier_2: 72
    hp_tier_3: 144
    hp_tier_4: 288

obstacle:
  # Higher HP - obstacles take more hits
  hp_by_tier:
    1: 8       # NORMAL: 5
    2: 14      # NORMAL: 8
    3: 28      # NORMAL: 16
    4: 56      # NORMAL: 32
  # Faster spawn rate
  spawning:
    biome_base: 30           # NORMAL: 40 (lower = faster spawn)
    biome_decay: 0.80        # NORMAL: 0.85
    sublevel_decay: 0.85     # NORMAL: 0.9
    min_spawn_rate: 4        # NORMAL: 6

progression:
  # Slower grade progression - birds level up slower
  grade_exp_factor: 1.10     # NORMAL: 1.07 (higher = slower leveling)

speed:
  # Higher momentum threshold - harder to gain momentum
  momentum_zero_height: 0.45  # NORMAL: 0.33 (higher = harder)
  # Faster game at high speeds
  frame_sleep_at_speed_1: 0.16    # NORMAL: 0.18
  frame_sleep_at_speed_10: 0.015  # NORMAL: 0.02 (lower = faster at max speed)
