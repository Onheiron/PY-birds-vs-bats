# BVB (Birds vs Bats) - SURVIVAL Difficulty Configuration
# Like ADVENTURE but NO life recovery when spawning new birds
# Use with: python -m src.game --config config_hard.yml

# Only override values that differ from config.yml (ADVENTURE)

game:
  difficulty_name: "SURVIVAL"
  life_recovery_on_spawn: false  # NO life recovery when new birds spawn!

# All other values are same as ADVENTURE (config.yml)
# The only difference is life_recovery_on_spawn: false
