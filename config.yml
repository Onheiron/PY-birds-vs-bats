# Speed & Miles system
# Speed (1-10): Controls game pace, uses SAME score progression as old level system (capped at 10)
# Miles: Distance traveled, accumulated based on current speed
# Level (1-1 to 6-3): 18 milestones based on miles traveled
speed:
  min_speed: 1                    # Starting speed level
  max_speed: 10                   # Maximum speed level (uses same score thresholds as old levels 1-10)
  mph_per_level: 40               # Miles per hour per speed level (40 = 40mph at speed 1, 400mph at speed 10)
  starting_momentum: 100          # Initial momentum at game start
  momentum_gain_multiplier: 100.0 # Multiplier for momentum gain (higher = faster speed progression)
  momentum_zero_height: 0.33      # Height fraction where momentum factor = 0 (0.0 = bottom, 1.0 = top)
