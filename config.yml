# =============================================================================
# UPGRADES: the tree bought with gold in the title menu (src/engine/meta.py)
# =============================================================================
# Each level costs costs[level] gold and applies its effects again (level 3
# of "+4% damage" is +12%). requires: {upgrade: level} to unlock it.
# Effects as for cards ({stat, add/pct}, {rerolls}, {skips}) plus
# {lives: n} (starting lives) and {gold_pct: n} (gold from achievements).
upgrades:
  tree:
    sharp_talons:  {name: Sharp Talons,  branch: Talons,  desc: Every bird hits harder,
                    costs: [15, 25, 40, 60, 90], effects: [{stat: damage_mult, pct: 4}]}
    piercing:      {name: Piercing,      branch: Talons,  desc: Ignore some armor,
                    costs: [30, 50, 80], requires: {sharp_talons: 2}, effects: [{stat: armor_pierce, add: 3}]}
    keen_eye:      {name: Keen Eye,      branch: Talons,  desc: More critical hits,
                    costs: [40, 65, 100], requires: {piercing: 1}, effects: [{stat: crit_chance, add: 0.03}]}
    giant_slayer:  {name: Giant Slayer,  branch: Talons,  desc: More damage to elites and bosses,
                    costs: [35, 60, 95], requires: {sharp_talons: 3}, effects: [{stat: vs_elites, add: 0.08}]}
    light_bones:   {name: Light Bones,   branch: Wings,   desc: Birds climb faster and hit harder,
                    costs: [15, 25, 40, 60, 90], effects: [{stat: rise_speed_bonus, add: 2}, {stat: damage_mult, pct: 3}]}
    air_brakes:    {name: Air Brakes,    branch: Wings,   desc: Birds fall more slowly,
                    costs: [20, 35, 55, 85], requires: {light_bones: 1}, effects: [{stat: fall_speed_bonus, add: -3}]}
    encore:        {name: Encore,        branch: Wings,   desc: One more power per ascent,
                    costs: [250], requires: {air_brakes: 3}, effects: [{stat: power_uses, add: 1}]}
    steady:        {name: Steady,        branch: Nerve,   desc: Scared birds fall less fast,
                    costs: [15, 25, 40, 65], effects: [{stat: fear_resist, add: 0.05}]}
    short_fear:    {name: Short Fear,    branch: Nerve,   desc: Scares wear off sooner,
                    costs: [30, 50, 80], requires: {steady: 2}, effects: [{stat: fear_duration_mult, pct: -8}]}
    fearless:      {name: Fearless,      branch: Nerve,   desc: Some scares miss,
                    costs: [45, 70, 110], requires: {short_fear: 1}, effects: [{stat: fear_immunity, add: 0.05}]}
    extra_life:    {name: Extra Life,    branch: Nest,    desc: Start with one more life,
                    costs: [25, 60, 120], effects: [{lives: 1}]}
    safety_net:    {name: Safety Net,    branch: Nest,    desc: Birds may bounce back from the floor,
                    costs: [40, 70, 110], requires: {extra_life: 1}, effects: [{stat: floor_save, add: 0.03}]}
    wide_nest:     {name: Wide Nest,     branch: Nest,    desc: Every egg offers one more card,
                    costs: [180], requires: {safety_net: 1}, effects: [{stat: choices, add: 1}]}
    gold_digger:   {name: Gold Digger,   branch: Fortune, desc: More gold from achievements,
                    costs: [15, 25, 40, 60, 90], effects: [{gold_pct: 10}]}
    lucky_eggs:    {name: Lucky Eggs,    branch: Fortune, desc: Enemies drop rarer eggs,
                    costs: [30, 50, 80], requires: {gold_digger: 1}, effects: [{stat: egg_luck, add: 0.02}]}
    rerolls:       {name: Rerolls,       branch: Fortune, desc: One more egg reroll per run,
                    costs: [25, 45, 70], requires: {gold_digger: 2}, effects: [{rerolls: 1}]}
    skips:         {name: Skips,         branch: Fortune, desc: One more egg skip per run,
                    costs: [30, 55], requires: {rerolls: 1}, effects: [{skips: 1}]}
    renown:        {name: Renown,        branch: Fortune, desc: Start with more prestige,
                    costs: [35, 55, 85, 130], requires: {lucky_eggs: 1}, effects: [{stat: prestige_bonus, add: 0.5}]}
