# BVB (Birds vs Bats) - Configuration File
# Copy this file to 'config.yml' and customize as needed
# Use --config path/to/config.yml to load a custom configuration
#
# All values shown are the defaults. You can override any value by
# uncommenting it and changing the value.
#
# Note: The structure must match the namespace structure in constants.py

layout:
  height: 30
  lane_positions: [5, 9, 13, 17, 21, 25, 29, 33, 37]
  max_lane_index: 8
  min_lane_index: 0
  num_balls: 9
  num_lanes: 9
  starting_line: 26
  width: 45
  # Aspect ratio for the entire screen (width:height)
  # Common values: "16:9" (widescreen), "4:3" (standard), "21:9" (ultrawide)
  # Terminal chars are ~2:1 (height is double width), this is accounted for
  aspect_ratio: "16:10"
  # Minimum panel width (content needs at least this much space)
  min_panel_width: 20

# Background rendering options
background:
  # Enable/disable background completely (the ^ tree pattern)
  enabled: true
  # Enable/disable parallax effect (the ∧ middle layer)
  # Only works if background.enabled is true
  parallax: false

birds:
  default_formation: [YELLOW, YELLOW, YELLOW, YELLOW, RED, RED, RED, BLUE, BLUE]
  randomize_lanes: true
  # Base damage (DMG) per bird type - used in damage formula
  damage:
    yellow: 1
    red: 1
    blue: 1
    patchwork: 1
    purple: 1
    clockwork: 1
    white: 2
    orange: 999  # One-hit kill
    gold: 0
    cookie: 1
    stealth: 8
    dinosaur: 5
    glitch: 1  # Glitch uses random multiplier
  # Base speed (SPD) per bird type
  speed:
    yellow: 2
    red: 3
    blue: 4
    patchwork: 3
    purple: 3
    clockwork: 2
    white: 4
    orange: 5
    gold: 6
    cookie: 3
