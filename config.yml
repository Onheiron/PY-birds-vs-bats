# BVB (Birds vs Bats) - Configuration File
# Copy this file to 'config.yml' and customize as needed
# Use --config path/to/config.yml to load a custom configuration
#
# All values shown are the defaults. You can override any value by
# uncommenting it and changing the value.
#
# Note: The structure must match the namespace structure in constants.py

layout:
  height: 30
  lane_positions: [5, 9, 13, 17, 21, 25, 29, 33, 37]
  num_balls: 9
  num_lanes: 9
  starting_line: 26
  width: 45
  # Aspect ratio for the entire screen (width:height)
  # Common values: "16:9" (widescreen), "4:3" (standard), "21:9" (ultrawide)
  # Terminal chars are ~2:1 (height is double width), this is accounted for
  aspect_ratio: "16:10"
  # Minimum panel width (content needs at least this much space)
  min_panel_width: 20

# Background rendering options
background:
  # Enable/disable background completely (the ^ tree pattern)
  enabled: true
  # Enable/disable parallax effect (the ∧ middle layer)
  # Only works if background.enabled is true
  parallax: false

birds:
  default_formation: [YELLOW, YELLOW, YELLOW, YELLOW, RED, RED, RED, BLUE, BLUE]
  randomize_lanes: true
  # Speed and damage of each bird: bird_stats.types (speed, damage)
timing:
  base_sleep: 0.2
  # Audio sync interval (frames)
  audio_sync_interval: 60

# Combat and scoring parameters
combat:
  # HP and damage are on a ×10 scale: XP from damage and score from kills divide by this
  hp_scale: 10
  # Every boss's HP is multiplied by this (one knob for all of them)
  boss_hp_mult: 1.0
  # ...and grows by this share per world after the first (0.5: ×3.5 in the last world)
  boss_hp_per_world: 0.5
  # Afflictions (freeze, poison, bleed) land this much less often on bosses
  boss_affliction_factor: 0.33
  # Score/XP multipliers for destroying enemies
  obstacle_destroy_xp_per_tier: 5    # XP = tier * this value
  obstacle_destroy_score_per_tier: 50  # Score = tier * this value
  bat_destroy_xp_per_tier: 5         # XP = tier * this value
  # Scared effect duration (seconds); how much faster a scared bird falls is the bat's fear_push
  scared_duration: 2.0
  # Damage formula: ((gear - gear_offset) * gear_coeff + dmg) * spd
  damage_formula:
    gear_offset: 3
    gear_coefficient: 1
  # Stealth bird tangible damage boost
  stealth_tangible_dmg_boost: 40
  # Glitch bird random damage multiplier range
  glitch_dmg_multiplier_min: 1
  glitch_dmg_multiplier_max: 8

# Loot and rarity
loot:
  # Glitch bird special loot interactions
  glitch_ignore_chance: 0.05         # Chance to ignore loot
  # Despawn times (seconds)
  loot_despawn_time: 30
  # Gold bird score per tick
  gold_bird_score_per_tick: 100
notifications:
  duration_seconds: 3.0
  max_stack: 3
eggs:
  # Which bird a bird card of each rarity hatches, with weights (see cards below)
  rarity_candidates:
    common:
      yellow_egg: 30
      red_egg: 30
      blue_egg: 25
      patchwork_egg: 15
    uncommon:
      frosty_egg: 25
      poison_egg: 25
      berserk_egg: 20
      purple_egg: 15
      rock_egg: 15
    rare:
      clockwork_egg: 30
      cookie_egg: 30
      stealth_egg: 20
      twister_egg: 20
    epic:
      white_egg: 34
      orange_egg: 33
      gold_egg: 33
    legendary:
      dinosaur_egg: 50
      glitch_egg: 50
    mythical:
      rainbow_egg: 100
bat_enemy:
  # Bat HP grows by this share per level above 1 (0.05: +85% at level 18)
  level_hp_multiplier: 0.05
  hp_by_tier:
    0: 160      # Mini bat (tier 0) - hides in obstacles
    1: 240
    2: 480
    3: 960
    4: 1920
  # Everything a world spawns. One entry per world (1 to 6):
  #   max_bats: bats on screen at most; spawn_interval: ticks between two spawns
  #   tiers: weights of tiers 1..4
  #   kinds: chance that a bat is of that kind (one kind at most, if its tier
  #          reaches kind_min_tier); the rest are plain bats
  #   height: rows where bats settle [min, max]; dive_height: where divers
  #          settle, as a share of the screen [min, max]
  #   mini_bat: chance that hitting a tier-3+ obstacle lets a mini bat out
  # The stats of each kind (abilities included) are in enemy_stats.bats, and
  # can change world by world in enemy_stats.bats.worlds.
  worlds:
    - {max_bats: 0, spawn_interval: 0,   tiers: [0, 0, 0, 0],     kinds: {},
       height: [3, 8],   dive_height: [0.05, 0.20], mini_bat: 0.10}
    - {max_bats: 3, spawn_interval: 110, tiers: [65, 30, 5, 0],   kinds: {diver: 0.08},
       height: [3, 8],   dive_height: [0.08, 0.25], mini_bat: 0.20}
    - {max_bats: 4, spawn_interval: 95,  tiers: [45, 35, 17, 3],
       kinds: {armored: 0.08, diver: 0.10, spellcaster: 0.06},
       height: [5, 12],  dive_height: [0.10, 0.30], mini_bat: 0.30}
    - {max_bats: 4, spawn_interval: 85,  tiers: [30, 40, 22, 8],
       kinds: {armored: 0.10, diver: 0.12, spellcaster: 0.08},
       height: [8, 16],  dive_height: [0.12, 0.35], mini_bat: 0.40}
    - {max_bats: 5, spawn_interval: 70,  tiers: [15, 35, 35, 15],
       kinds: {armored: 0.15, diver: 0.12, spellcaster: 0.10},
       height: [10, 20], dive_height: [0.15, 0.40], mini_bat: 0.50}
    - {max_bats: 6, spawn_interval: 55,  tiers: [5, 25, 45, 25],
       kinds: {armored: 0.20, diver: 0.14, spellcaster: 0.12},
       height: [12, 23], dive_height: [0.18, 0.45], mini_bat: 0.60}
  # Lowest tier of each kind
  kind_min_tier: {armored: 2, diver: 1, spellcaster: 2, healer: 2, bomber: 2, plague: 2, necromancer: 3}
  # Armor of armored bats, by tier
  armored:
    armor_by_tier: {2: 10, 3: 10, 4: 20}
  # Mini bats (tier 0) hide in tier 3+ obstacles; the chance is the world's mini_bat
  mini_bat:
    min_level: 2                   # Minimum game level for mini bats to spawn (1-18)
    min_obstacle_tier: 3           # Minimum obstacle tier that can hide mini bats
    min_y_fraction: 0.25           # Obstacle must be at least this far down screen (0.0=top, 1.0=bottom)
    anim_frames_per_step: 2        # Animation speed
  # A share of mini bats are jumpscares: out of the obstacle, a scary face
  # scares the birds in affected_lanes lanes for fear_duration seconds
  jumpscare_bat:
    spawn_chance: 0.15             # Share of mini bats that are jumpscares
    visible_duration: 3.0          # Seconds to stay visible before hiding again
    scary_face_duration: 0.5       # Seconds to show scary face
    fear_duration: 2.0             # Base fear duration in seconds
    affected_lanes: 3              # Number of lanes affected by scary face (centered on bat)
    random_scream_chance: 0.02     # Chance per frame to scream again while visible
boss:
  # HP for the boss (high HP, requires sustained effort)
  hp: 1000
  # Armor reduction (subtracted from each hit)
  armor_reduction: 10
  # Scream attack settings
  scream:
    probability_per_second: 0.15    # Chance per second to scream
    cooldown_seconds: 3.0           # Minimum time between screams
    scare_duration: 1               # Fear effect duration (like tier 1 bat)
  # Movement settings
  descent_speed: 8                  # Frames between descent steps
  oscillation_range: 2              # Max columns to move left/right (subtle movement)
  oscillation_speed: 12             # Frames between oscillation steps
  # Score and XP rewards
  score: 1000
  xp: 100
  # Spawn timing - boss spawns when this many miles remain before level transition
  spawn_miles_before_transition: 1  # Very close to transition
  # Which levels have bosses (end of each biome = x-3 levels)
  boss_levels: [3, 6, 9, 12, 15, 18]  # 1-3, 2-3, 3-3, 4-3, 5-3, 6-3
  # Boss corpse obstacle settings (after death, becomes falling obstacle)
  corpse:
    hp: 640                          # HP for the falling dead boss
  # Loot settings (drops when boss dies)
  loot:
    count: 3                        # Number of items to drop

# Wind Boss configuration - boss for level 2-3 (The Borders)
wind_boss:
  level: 6                          # Which level this boss appears (2-3 = level 6)
  spawn_miles_before_transition: 1  # Spawn 1 mile before level end
  hp: 6000                           # Slightly more HP than regular boss
  armor_reduction: 10
  # Animation timing
  anim_frames_per_step: 8           # Frames between animation steps
  # Wind effects - intensity grows each frame
  # Tailwind: starts at max_down (frame 5), grows until pull_up_4 (frame 9)
  tailwind:
    up_bonus_min: 2                 # Starting bonus at max_down
    up_bonus_max: 5                 # Max bonus at pull_up_4
    down_penalty_min: 2             # Starting penalty at max_down
    down_penalty_max: 5             # Max penalty at pull_up_4
  # Headwind: starts at max_up (frame 0), grows until push_down_4 (frame 4)
  headwind:
    up_penalty_min: 2               # Starting penalty at max_up
    up_penalty_max: 4               # Max penalty at push_down_4
    down_bonus_min: 2               # Starting bonus at max_up
    down_bonus_max: 5               # Max bonus at push_down_4
  # Movement settings
  descent_speed: 8
  oscillation_range: 2
  oscillation_speed: 12
  # Rewards
  score: 1200
  xp: 120

# Jelly Boss configuration - boss for level 3-3 (Rotten Marshes)
jelly_boss:
  level: 9                            # Which level this boss appears (3-3 = level 9)
  spawn_miles_before_transition: 1    # Spawn 1 mile before level end (like wind boss)
  hp: 4000                             # Higher HP
  armor_reduction: -10                 # Less armor (takes more damage)
  # Position - settles at 1/4 from top
  target_y_fraction: 0.25             # Fraction of screen height from top
  # Animation timing (10 frames, 1 fps = 10 seconds per cycle)
  anim_frames_per_step: 5             # 5 game frames per animation frame (at ~5fps = 1s)
  # Bat spawning
  spawn_frame: 8                      # Spawn bat on frame 8 (1-indexed)
  max_spawned_bats: 5                 # Maximum bats that can be spawned
  spawn_anim_duration: 0.5            # Seconds for spawn animation
  # Movement settings
  descent_speed: 8
  oscillation_range: 10               # Wide oscillation (left/right)
  oscillation_speed: 5                # Faster oscillation
  # Rewards
  score: 1500
  xp: 150
  # Corpse settings
  corpse:
    hp: 800

# Tree Boss configuration - boss for level 4-3 (Dark Swamp)
# Giant tree spanning entire screen with tangible branches
tree_boss:
  level: 12                           # Which level this boss appears (4-3 = level 12)
  spawn_miles_before_transition: 3   # Spawn 3 miles before level end
  stop_offset: -2                    # Tree stops N rows from top (negative = higher up)

  # Branch settings (5 foreground tangible branches)
  branches:
    base_hp: 300                       # HP per branch
    # Positions as fractions of screen (x_frac, y_frac from top-left)
    # y_frac max 0.45 to keep branches in upper half of screen
    positions:
      - {x_frac: 0.15, y_frac: 0.15}  # Upper left
      - {x_frac: 0.75, y_frac: 0.12}  # Upper right
      - {x_frac: 0.45, y_frac: 0.28}  # Middle center
      - {x_frac: 0.20, y_frac: 0.40}  # Lower left
      - {x_frac: 0.70, y_frac: 0.35}  # Lower right

    # Effects when bird hits a branch
    on_hit:
      stun_duration: 1.0              # Seconds bird can't be bounced after hit
      fall_boost_duration: 1.0        # +1 fall speed for 1 second
      fall_boost_speed: 1
      jumpscare_probability: 0.02     # 2% chance to spawn jumpscare bat

  # Flower settings (grow on branches)
  flowers:
    grow_interval: 2.0                # Seconds per growth frame (6 frames = 12s to mature)
    hp: 300                            # Flower HP (destroyed before branch takes damage)
    respawn_delay: 2.0                # Seconds before new flower starts growing

    # Red flower: BLEED effect - countdown timer, each UP press costs a life
    red:
      probability: 0.6                # 60% chance to bleed on hit
      bleed_duration: 3.0             # Seconds until bleed wears off (bird survives)
      speed_penalty: 2                # -2 speed while bleeding
      lives: 2                        # UP presses before death

    # Yellow flower: STUN effect - bird falls slowly, can't bounce
    yellow:
      probability: 0.6                # 60% chance to stun on hit
      stun_duration: 3.0              # Seconds bird is stunned
      speed_penalty: 3                # -3 speed while stunned

    # Blue flower: FREEZE effect - falls slowly, mash button to thaw
    blue:
      probability: 0.6                # 60% chance to freeze on hit
      thaw_attempts_min: 3            # Minimum button presses to thaw
      thaw_attempts_max: 5            # Maximum button presses to thaw
      speed_penalty: 3                # -3 speed while frozen (same as stun)

    # Green flower: POISON effect - countdown to death, mash button to cure
    green:
      probability: 0.6                # 60% chance to poison on hit
      poison_duration: 7.0           # Seconds until bird dies if not cured
      cure_attempts_min: 2            # Minimum button presses to cure
      cure_attempts_max: 4            # Maximum button presses to cure
      speed_penalty: 1                # -1 speed while poisoned

  # Rewards
  score: 2000
  xp: 200

# Swamp obstacle flowers - Dark Swamp (biome 4) obstacles can bloom flowers
swamp_flowers:
  bloom_probability: 0.5            # 50% chance per obstacle to have a flower
  # Uses same flower types and effects as tree_boss.flowers

# Owl Boss configuration - boss for level 5-3 (Haunted Woods)
# Wizard owl that casts powerful spells
owl_boss:
  level: 15                           # Which level this boss appears (5-3 = level 15)
  spawn_miles_before_transition: 3    # Spawn 3 miles before level end
  hp: 5000                             # High HP
  armor_reduction: 10                  # Standard armor

  # Position - settles at 1/6 from top (very high on screen)
  target_y_fraction: 0.15             # Fraction of screen height from top

  # Animation timing - 4 seconds per stage (fly, conjure, cast, recharge)
  stage_duration: 4.0                 # Seconds per stage
  anim_frames_per_step: 8             # Frames between animation steps

  # Movement settings
  descent_speed: 6                    # Frames between descent steps
  oscillation_range: 8                # Columns to move left/right
  oscillation_speed: 10               # Frames between oscillation steps

  # Spell cycle: each spell is cast in sequence
  # Order: overgrowth, terror, ominous_wind, evocation, bend_space, bend_time, meteor_shower
  spells:
    overgrowth:
      tree_count: 5                   # Number of tree obstacles to conjure
      tree_hp: 400                     # HP of conjured trees

    terror:
      # Swaps all birds, filling outer lanes first, center lanes last
      swap_delay: 0.3                 # Seconds between each swap

    ominous_wind:
      duration: 3.0                   # Wind effect duration (seconds)
      down_bonus: 2                   # Speed boost when going down
      up_penalty: 2                   # Speed penalty when going up

    evocation:
      bat_count: 3                    # Number of bats to summon
      bat_tier_min: 2                 # Minimum bat tier
      bat_tier_max: 4                 # Maximum bat tier
      spawn_as_special: true          # Can spawn as armored/diver/spellcaster

    bend_space:
      portal_pairs: 2                 # Number of portal pairs (2 pairs = 4 portals)
      bottom_y_fraction: 0.66         # Y position of bottom portals (2/3 down)
      top_y_fraction: 0.33            # Y position of top portals (1/3 down)
      portal_duration: 60.0           # How long portals stay active (seconds)

    bend_time:
      duration: 4.0                   # Slowdown duration (seconds)
      slowdown_factor: 2.0            # Game runs at 1/2 speed
      boss_immune: true               # Boss continues at normal speed

    meteor_shower:
      meteor_count: 4                 # Number of meteors (2 left, 2 right of boss)
      meteor_width: 6                 # Width in characters (2 lanes)
      meteor_hp: 300                   # HP per meteor
      speed_multiplier: 1.5           # 1.5x obstacle speed
      spawn_offset: 2                 # Lanes offset from boss center

  # Rewards
  score: 2500
  xp: 250

  # Corpse settings
  corpse:
    hp: 1000

obstacle:
  # Base HP per tier (before level scaling)
  hp_by_tier:
    1: 50
    2: 80
    3: 160
    4: 320
  # HP scaling with level: hp = base_hp * (1 + (level-1) * level_hp_multiplier)
  level_hp_multiplier: 0.1
  # Legacy max_hp_by_tier for render color calculation
  max_hp_by_tier:
    1: 40
    2: 60
    3: 120
    4: 270
  spawning:
    # Spawn rate formula: biome_base * (biome_decay ^ level_group) * (sublevel_decay ^ (sub_level-1))
    biome_base: 34           # Base spawn rate
    biome_decay: 0.85        # Multiplier per biome (lower = faster spawn in later biomes)
    sublevel_decay: 0.9      # Multiplier per sub-level (lower = faster spawn in later sub-levels)
    min_spawn_rate: 6        # Minimum frames between spawns
  # Tier weights per level range [tier1, tier2, tier3, tier4]
  tier_weights:
    level_1_3: [60, 28, 10, 2]    # Levels 1-1 to 1-3
    level_4_6: [45, 35, 15, 5]    # Levels 2-1 to 2-3
    level_7_9: [30, 35, 25, 10]   # Levels 3-1 to 3-3
    level_10_12: [20, 35, 30, 15] # Levels 4-1 to 4-3
    level_13_15: [10, 30, 38, 22] # Levels 5-1 to 5-3
    level_16_18: [5, 20, 45, 30]  # Levels 6-1 to 6-3
wide_cursor:
  lanes:
    base: 3
    max: 5
  seconds:
    base: 10.0
    max: 50.0
    plus: 20.0
    plusplus: 25.0
tailwind:
  down_penalty:
    base: 1
    max: 3
    plus: 1
    plusplus: 2
  seconds:
    base: 10.0
    max: 30.0
    plus: 15.0
    plusplus: 20.0
  up_bonus:
    base: 1
    plus: 2
    plusplus: 3
dinosaur:
  press_chunk: 3
stealth:
  speed_boost: 6
  tangible_seconds: 3.0
clockwork:
  decay_seconds: 30.0
  initial_charge: 2
  max_charge: 3
glitch:
  bounce_ignore_chance: 0.02
  duplicate_chance: 0.002
  flip_chance: 0.003
  nudge_chance: 0.002
  speed:
    max: 6
    min: 1
  swap_chance: 0.003
# Synergies between birds in neighbouring lanes (src/engine/synergies.py).
# Patchwork counts as the partner of every synergy.
synergies:
  yellow_cures_blue_rows: 1    # a scared falling Blue is cured passing a rising Yellow this many rows away
  phoenix_per_red: 0.05        # wake chance of the Phoenix egg added by each Red next to it
  yellow_clockwork_charge: 1   # charge the Yellow power adds to a Clockwork next to it
  twister_sprint: 4            # Blue sprint after a bounce added by each Twister next to it (x10 scale)
  cookie_xp: 0.25              # XP share a Cookie gains from each Cookie next to it

orange:
  recover_chance: 0.1

# New birds
rainbow:
  max_charge: 100
  decay_per_second: 5         # Lose 5 charge per second
  recharge_chance: 0.25       # 25% chance to recharge on UP press
  recharge_amount: 25         # Amount of charge restored

twister:
  tailwind_duration: 2.0      # Seconds of tailwind effect
  tailwind_up_bonus: 2        # Speed boost when going up
  tailwind_down_penalty: 1    # Speed reduction when going down

frosty:
  boosted_chance: 0.60        # 60% when power active
  boost_duration: 2.0         # Power boost lasts 2s
  freeze_duration: 3.0        # Frozen enemies stay frozen 3s
  freeze_slow: 0.4            # Frozen enemies move at 40% of their speed
  armor_reduction: 20         # Frozen enemies lose 20 armor

poison:
  boosted_chance: 0.60
  boost_duration: 2.0
  effect_duration: 5.0        # Poison lasts 5s
  damage_per_second: 20        # HP per second

berserk:
  boosted_chance: 0.60
  boost_duration: 2.0
  effect_duration: 10.0       # Bleed lasts 10s
  damage_per_second: 10        # HP per second
  armor_reduction: 10          # armor lost while bleeding

rock:
  boosted_push_rows: 2        # Push when power active
  boost_duration: 3.0         # Power lasts 3s
  boosted_speed: 3            # Speed during power

timelapse:
  # Duration in seconds (real time, not affected by slowdown)
  seconds:
    base: 2.0       # timelapse: 2 seconds
    plus: 3.0       # timelapse+: 3 seconds
    plusplus: 4.0   # timelapse++: 4 seconds
    max: 5.0        # timelapse_max: 5 seconds
  # Slowdown multiplier (2.0 = game runs at half speed)
  slowdown:
    base: 1.5
    plus: 1.75
    max: 2.0
progression:
  # XP a bird earns by moving, as a share of the score it makes (hits and kills earn their own)
  move_xp_factor: 0.3
  grade_exp_factor: 1.07
  level_score_base: 500.0
  level_score_factor: 1.08
  xp_base: 500.0

# Speed & Miles system
# Speed (1-10): Controls game pace, uses SAME score progression as old level system (capped at 10)
# Miles: Distance traveled, accumulated based on current speed
# Level (1-1 to 6-3): 18 milestones based on miles traveled
speed:
  min_speed: 1                    # Starting speed level
  max_speed: 10                   # Maximum speed level (uses same score thresholds as old levels 1-10)
  # Highest gear in each world: speed is the main source of difficulty, so it ramps up
  # world by world (a slow first world to learn, a jump into the second)
  max_gear_by_world: [5, 9, 9, 9, 10, 10]
  mph_per_level: 40               # Miles per hour per speed level (40 = 40mph at speed 1, 400mph at speed 10)
  starting_momentum: 100          # Initial momentum at game start
  momentum_gain_multiplier: 115.0 # Multiplier for momentum gain (higher = faster speed progression)
  momentum_zero_height: 0.33      # Height fraction where momentum factor = 0 (0.0 = bottom, 1.0 = top)

# Score calculation settings
score:
  score_breakeven_height: 0.33    # Height fraction where score multiplier = 1.0 (0.0 = bottom, 1.0 = top)

# Level milestones (18 levels in 6 groups of 3)
# Distances: 3, 7, 12, 18, 25, 33, 42, 52, 63, 75, 88, 102, 117, 133, 150, 168, 187, 207
levels:
  total_levels: 18
  levels_per_group: 3
  starting_distance: 3            # First milestone at 3 miles
  # Milestones auto-calculated: 3, 7, 12, 18, 25, 33, 42, 52, 63, 75, 88, 102, 117, 133, 150, 168, 187, 207
game_over:
  leaderboard_name_max_length: 20
  minutes_divider: 60
  time_divider: 3600
  time_remainder: 3600
game:
  version: 0.8.0
  # Difficulty settings
  difficulty_name: "ADVENTURE"  # Display name for difficulty
  life_recovery_on_spawn: true  # If true, spawning a new bird from egg recovers a life

# Difficulty modes - affects rarity spawn probabilities
# Formula: weight[i] = base_weight[i] * (1 + prestige * rarity_factor * i * tier_scaling)
# Higher tier_scaling = more boost to rare items
# Higher base_rarity_boost = flat multiplier to all rare weights (i > 0)
difficulty:
  adventure:
    name: "ADVENTURE"
    tier_scaling: 1.0           # Standard scaling
    base_rarity_boost: 1.0      # No boost to rare weights
    rarity_factor: 0.1          # Standard prestige factor
  legendary:
    name: "LEGENDARY"
    tier_scaling: 2.0           # Double the prestige effect on rare tiers
    base_rarity_boost: 10.0     # 10x base weight for uncommon+
    rarity_factor: 0.15         # 50% more prestige effect
prestige:
  modifiers:
    D: 0.0
    C1: 0.03125
    C2: 0.0625
    B1: 0.125
    B2: 0.25
    A1: 0.5
    A2: 1.0
    S: 5.0
  rarity_factor: 0.1

colors:
  bats_base_rgb: [255, 0, 255]
  obstacles_base_rgb: [0, 255, 0]

# =============================================================================
# Bird stats (see docs/birds.md and src/engine/stats.py for every stat)
# A bird's stat = default (in the code) -> value for its type -> grade growth,
# then modifiers from cards, boosts and pacts.
# =============================================================================
bird_stats:
  # Override a default for every bird, e.g. pickup_radius: 3
  defaults: {}
  # Every bird's sheet. Scale: speed 10 = 1 cell every 5 ticks, 50+ = every
  # tick (old speed points × 10); damage and enemy HP are × combat.hp_scale.
  # Speed bonuses (rise / fall / sprint) use the same ×10 scale.
  types:
    YELLOW:    {speed: 21, damage: 9,  fall_speed_bonus: -2, fear_resist: 0.3, fear_duration_mult: 0.8,
                pickup_radius: 3, luck: 0.05, xp_gain: 1.1, weight: 1.0}
    RED:       {speed: 30, damage: 11, crit_chance: 0.12, crit_damage: 2.2, vs_obstacles: 0.25,
                armor_pierce: 3, fear_duration_mult: 1.0, weight: 1.1}
    BLUE:      {speed: 42, damage: 10, speed_damage: 2.0, fall_speed_bonus: 5, bounce_sprint: 8, bounce_sprint_seconds: 0.6,
                crit_chance: 0.05, vs_bats: 0.1, fear_duration_mult: 1.3, weight: 0.8}
    PATCHWORK: {speed: 30, damage: 10, luck: 0.05, fear_resist: 0.1, xp_gain: 1.2, weight: 1.0}
    PURPLE:    {speed: 28, damage: 10, power_potency: 1.1, crit_chance: 0.05, fear_resist: 0.2,
                prestige: 1, weight: 1.1}
    CLOCKWORK: {speed: 20, damage: 11, armor_pierce: 3, impact_stun: 0.7, fear_immunity: 0.15,
                prestige: 2, weight: 1.3}
    WHITE:     {speed: 40, damage: 20, power_duration: 1.2, fear_resist: 0.4, vs_elites: 0.2,
                pickup_radius: 3, prestige: 3, score_mult: 1.5, weight: 1.2}
    ORANGE:    {speed: 50, damage: 999, fear_immunity: 0.5, impact_stun: 0, prestige: 3, score_mult: 0.5}
    GOLD:      {speed: 58, damage: 2, luck: 0.15, pickup_radius: 4, prestige: 3, score_mult: 10.0,
                weight: 0.7}   # Gold scores a flat amount (loot.gold_bird_score_per_tick)
    COOKIE:    {speed: 29, damage: 9, xp_gain: 1.5, pickup_radius: 3, fear_duration_mult: 1.1, prestige: 2}
    STEALTH:   {speed: 31, damage: 75, crit_chance: 0.2, crit_damage: 2.5, armor_pierce: 5, vs_elites: 0.3,
                prestige: 2, score_mult: 1.2, weight: 0.9}
    DINOSAUR:  {speed: 38, damage: 50, fall_speed_bonus: 6, presses_to_bounce: 15, hitbox_height: 3,
                hitbox_width: 9, weight: 2.5, impact_stun: 0.5, fear_immunity: 0.4, vs_obstacles: 0.4,
                knockback: 1, prestige: 4, score_mult: 2.0}
    GLITCH:    {speed: 30, damage: 10, crit_chance: 0.1, crit_damage: 3.0, floor_save: 0.1, luck: 0.1}
               # Glitch speed (1-6 points), damage (×1-8) and prestige (1-7) are random
    RAINBOW:   {speed: 60, damage: 30, fear_resist: 0.3, luck: 0.1, pickup_radius: 3, prestige: 5,
                score_mult: 1.3}
    TWISTER:   {speed: 40, damage: 45, rise_speed_bonus: 5, fall_speed_bonus: -5, knockback: 1,
                fear_resist: 0.2, prestige: 2, weight: 0.9}
    FROSTY:    {speed: 29, damage: 28, affliction_chance: 0.3, vs_elites: 0.1, fear_duration_mult: 0.9,
                impact_stun: 0.8, prestige: 1}
    POISON:    {speed: 31, damage: 27, affliction_chance: 0.3, crit_chance: 0.05, power_duration: 1.1,
                prestige: 1}
    BERSERK:   {speed: 32, damage: 40, affliction_chance: 0.3, crit_chance: 0.15, fear_immunity: 0.25,
                impact_stun: 1.3, prestige: 1}
    ROCK:      {speed: 19, damage: 31, fall_speed_bonus: 3, knockback: 1, armor_pierce: 4, weight: 2.0,
                impact_stun: 0.6, fear_resist: 0.3, prestige: 1}
  # Bonus a bird has from each grade on (a higher grade replaces the value of a
  # lower one for the same stat). Per-type growth goes in type_growth, keyed
  # TYPE_GRADE, e.g. RED_A1: {damage_bonus: 1}.
  growth:
    C1: {prestige: 0.03125, score_grade_bonus: 0.1}
    C2: {prestige: 0.0625,  score_grade_bonus: 0.2}
    B1: {prestige: 0.125,   score_grade_bonus: 0.3, fear_duration_cut: 1}
    B2: {prestige: 0.25,    score_grade_bonus: 0.4}
    A1: {prestige: 0.5,     score_grade_bonus: 0.5, power_uses: 1}
    A2: {prestige: 1.0,     score_grade_bonus: 0.6}
    S:  {prestige: 5.0,     score_grade_bonus: 1.0}
  type_growth: {}

# =============================================================================
# ENEMY STATS (see docs/stats.md)
# =============================================================================
# Resolved when an enemy spawns: defaults, then per tier, then per kind
# (armored / diver / spellcaster), then elite stats and affixes. Flat stats
# add up; hp_mult, damage_taken, fear_strength, speed, xp_mult and
# score_mult multiply. Armored bats also get bat_enemy.armored.armor_by_tier as armor.
enemy_stats:
  bats:
    defaults: {}
    # Tier 0 = mini bats (hidden in obstacles, jumpscares)
    tiers:
      0: {defense: 0, fear_strength: 1.2}             # jumpscares are scarier
      1: {}
      2: {defense: 1, fear_strength: 1.1}
      3: {defense: 2, fear_strength: 1.2, regen: 5, spells: 1, silence_time: 1.0}
      4: {defense: 4, fear_strength: 1.3, regen: 10, speed: 0.9, spells: 2, silence_time: 2.0,
          wind_time: 1.5}
    # Each kind: its toughness, and the numbers of its ability (see the stat list in docs/stats.md)
    kinds:
      armored:     {hp_mult: 1.3, projectile_defense: -5, speed: 0.6, descent_interval: 1, move_step: -1,
                    linger: 90, fear_push: 1, fear_strength: 1.2, xp_mult: 1.3, score_mult: 1.3}
      diver:       {hp_mult: 0.8, contact_defense: -3, speed: 1.3, fear_strength: 1.3, xp_mult: 1.2,
                    ability_chance: 0.2}
      spellcaster: {hp_mult: 0.7, projectile_defense: 5, contact_defense: -2, speed: 0.9,
                    fear_strength: 1.5, fear_radius: 1, xp_mult: 1.4, score_mult: 1.4,
                    ability_chance: 0.1, ability_interval: 3.0}
    # Changes world by world: flat stats for every bat, or per tier / per kind
    worlds:
      3: {kinds: {spellcaster: {spells: -2, ability_chance: 0.05}}}   # silence only
      4: {kinds: {spellcaster: {ability_chance: 0.10}}}
      5: {kinds: {spellcaster: {ability_chance: 0.15}}}
      6: {kinds: {spellcaster: {ability_chance: 0.20}}}
    # What an elite of a kind gets on top of the elite stats
    elite_kinds: {}
  obstacles:
    defaults: {}
    tiers:
      1: {projectile_defense: -3}                     # tree: wood splinters
      2: {defense: 3, projectile_defense: 3}          # rock
      3: {damage_taken: 1.2, projectile_defense: 5}   # cloud: soft, but shots pass through
      4: {armor: 8, defense: 2}                       # barrier

# =============================================================================
# ELITE BATS
# =============================================================================
# A spawning bat becomes an elite with chance_by_biome[biome - 1]; it gets
# the stats below plus affix_count_by_biome random affixes. Birds' vs_elites
# bonus applies against elites and bosses.
elites:
  chance_by_biome: [0, 0.03, 0.06, 0.09, 0.12, 0.15]
  affix_count_by_biome: [1, 1, 1, 2, 2, 2]
  stats: {hp_mult: 2.0, xp_mult: 2.0, score_mult: 2.0, loot_rarity_bonus: 1}
  affixes:
    ironclad:     {name: Ironclad,     stats: {armor: 20}}
    regenerating: {name: Regenerating, stats: {regen: 20}}
    terrifying:   {name: Terrifying,   stats: {fear_strength: 1.5, fear_radius: 1}}
    swift:        {name: Swift,        stats: {speed: 1.5}}
    warded:       {name: Warded,       stats: {projectile_defense: 30}}
    hulking:      {name: Hulking,      stats: {hp_mult: 1.5, damage_taken: 0.8}}
    bountiful:    {name: Bountiful,    stats: {xp_mult: 1.5, loot_rarity_bonus: 1}}

# =============================================================================
# POWER DAMAGE (× combat.hp_scale)
# =============================================================================
power_damage:
  red_shot: 3            # Red projectile
  red_per_neighbour: 2   # + per rising Red / Purple / Patchwork beside it
  purple_tiers: [3, 10, 30, 90]   # Purple shot after 0 / 1 / 2 / 3 s of charge

# =============================================================================
# CARDS (eggs)
# =============================================================================
# Every enemy drop is an egg of a rarity: grey common, green uncommon, blue
# rare, purple epic, yellow legendary, white mythical. Picking it up stops
# the game and offers bird_stats flock stat "choices" cards (3 to start).
# The first card has the egg's rarity; the others roll theirs from
# other_slots[egg rarity] (weights for common ... mythical).
# See src/engine/cards.py and docs/cards.md.
cards:
  # Chance that a defeated enemy drops an egg at all
  drop_chance: {bat: 1.0, mini_bat: 1.0, boss: 1.0}
  # Rarity of a dropped egg: base weights per source (common ... mythical),
  # then each bat tier above 1 multiplies weight i by (1 + tier_shift × i),
  # then prestige (× prestige_scale) pushes towards rarer eggs as set by the
  # difficulty (difficulty.<mode>.rarity_factor / tier_scaling / base_rarity_boost).
  # Expected in a normal run (~40 eggs): ~1–2 epic, a legendary every 2–3 runs,
  # a mythical about once in 15 runs.
  rarity_weights:
    #          common uncommon rare epic legendary mythical
    mini_bat: [72,    21,      6,   1,   0,        0]
    bat:      [64,    24,      8.5, 3,   0.4,      0.04]
    boss:     [10,    40,      35,  12,  2.5,      0.3]
  tier_shift: 0.05
  prestige_scale: 0.03
  other_slots:
    #            common uncommon rare epic legendary mythical
    common:    [80,    18,      2,   0,   0,        0]
    uncommon:  [55,    35,      9,   1,   0,        0]
    rare:      [4,     55,      33,  8,   0,        0]
    epic:      [0,     30,      50,  18,  2,        0]
    legendary: [0,     0,       45,  45,  10,       0]
    mythical:  [0,     0,       15,  45,  35,       5]
  # Effect values below are those of a common card; rarer cards multiply them
  rarity_scale: {common: 1, uncommon: 1.6, rare: 2.4, epic: 3.5, legendary: 5, mythical: 7}
  # Rerolls (R: new cards for the same egg) and skips (S: take nothing) per run
  rerolls: 3
  skips: 3
  # Weight of "hatch a bird" among the cards of a rarity, while a lane is free
  bird_weight: 3
  # kind: stat (permanent, whole flock) | boost (temporary) | powerup | training |
  #       cursed (bonus with a drawback) | flock (flock stat)
  # Effects: {stat, add} adds to a stat, {stat, pct} multiplies it by 1 + pct/100,
  # seconds makes it temporary, scale: false keeps the value at every rarity.
  catalog:
    sharp_beaks:     {name: Sharp Beaks, desc: "Every bird hits harder.",     kind: stat, effects: [{stat: damage_mult, pct: 8}]}
    hollow_bones:    {name: Hollow Bones, desc: "Birds climb faster and hit harder.", kind: stat,
                      effects: [{stat: rise_speed_bonus, add: 3}, {stat: damage_mult, pct: 5}]}
    feather_brake:   {name: Feather Brake, desc: "Birds fall more slowly: more time to bounce them.",   kind: stat, effects: [{stat: fall_speed_bonus, add: -4}]}
    keen_eyes:       {name: Keen Eyes, desc: "More critical hits.",       kind: stat, effects: [{stat: crit_chance, add: 0.03}]}
    heavy_blows:     {name: Heavy Blows, desc: "Critical hits hurt more.",     kind: stat, effects: [{stat: crit_damage, add: 0.15}]}
    brave_hearts:    {name: Brave Hearts, desc: "Scared birds fall less fast.",    kind: stat, effects: [{stat: fear_resist, add: 0.1}]}
    steady_nerves:   {name: Steady Nerves, desc: "Scares wear off sooner.",   kind: stat, effects: [{stat: fear_duration_mult, pct: -10}]}
    piercing_talons: {name: Piercing Talons, desc: "Ignore part of the armor of bats and barriers.", kind: stat, effects: [{stat: armor_pierce, add: 3}]}
    bat_hunter:      {name: Bat Hunter, desc: "More damage against bats.",      kind: stat, effects: [{stat: vs_bats, add: 0.06}]}
    lumberjack:      {name: Lumberjack, desc: "More damage against obstacles.",      kind: stat, effects: [{stat: vs_obstacles, add: 0.08}]}
    giant_slayer:    {name: Giant Slayer, desc: "More damage against elites and bosses.",    kind: stat, effects: [{stat: vs_elites, add: 0.08}], min_rarity: uncommon}
    wide_wings:      {name: Wide Wings, desc: "Birds collect eggs from farther away.",      kind: stat, effects: [{stat: pickup_radius, add: 0.5}]}
    lucky_feather:   {name: Lucky Feather, desc: "An egg a bird collects may turn one rarity rarer.",   kind: stat, effects: [{stat: luck, add: 0.02}]}
    quick_study:     {name: Quick Study, desc: "Birds earn more XP from hits and kills.",     kind: stat, effects: [{stat: xp_gain, pct: 6}]}
    show_off:        {name: Show-off, desc: "More points.",        kind: stat, effects: [{stat: score_mult, pct: 5}]}
    lasting_powers:  {name: Lasting Powers, desc: "Powers last longer.",  kind: stat, effects: [{stat: power_duration, pct: 8}]}
    potent_powers:   {name: Potent Powers, desc: "Powers hit harder.",   kind: stat, effects: [{stat: power_potency, pct: 8}]}
    safety_net:      {name: Safety Net, desc: "A bird reaching the floor may bounce back instead.",      kind: stat, effects: [{stat: floor_save, add: 0.02}], min_rarity: rare}
    second_wind:     {name: Second Wind, desc: "Every bird can fire its power once more per ascent.",     kind: stat, effects: [{stat: power_uses, add: 1, scale: false}],
                      min_rarity: legendary}
    frenzy:          {name: Frenzy, desc: "A short burst of damage.",          kind: boost, effects: [{stat: damage_mult, pct: 40, seconds: 20}]}
    fearless:        {name: Fearless, desc: "Bats may fail to scare the flock.",        kind: boost, effects: [{stat: fear_immunity, add: 0.25, seconds: 20}]}
    jet_stream:      {name: Updraft, desc: "Birds fall slowly for a while.", kind: boost,
                      effects: [{stat: fall_speed_bonus, add: -15, seconds: 20}]}
    golden_hour:     {name: Golden Hour, desc: "More points for a while.",     kind: boost, effects: [{stat: score_mult, pct: 40, seconds: 20}]}
    tailwind:        {name: Tailwind, desc: "A wind that lifts the whole flock.",        kind: powerup, powerup: tailwind, max_rarity: epic}
    wide_cursor:     {name: Wide Cursor, desc: "The cursor covers more lanes.",     kind: powerup, powerup: wide_cursor, max_rarity: epic}
    timelapse:       {name: Timelapse, desc: "Slow time down to catch falling birds.",       kind: powerup, powerup: timelapse, max_rarity: epic}
    training:        {name: Training, desc: "XP for every bird right now.",        kind: training, effects: [{xp: 40}]}
    glass_wings:     {name: Glass Wings, desc: "Much more damage, but birds fall faster.",     kind: cursed, min_rarity: uncommon,
                      effects: [{stat: damage_mult, pct: 15}], drawbacks: [{stat: fall_speed_bonus, add: 4}]}
    heavy_crown:     {name: Heavy Crown, desc: "Much more score, but birds rise more slowly.",     kind: cursed, min_rarity: uncommon,
                      effects: [{stat: score_mult, pct: 15}], drawbacks: [{stat: rise_speed_bonus, add: -4}]}
    reckless:        {name: Reckless, desc: "More crits, but scares last longer.",        kind: cursed, min_rarity: uncommon,
                      effects: [{stat: crit_chance, add: 0.06}], drawbacks: [{stat: fear_duration_mult, pct: 10}]}
    blood_price:     {name: Blood Price, desc: "Stronger powers, but hitting things stuns longer.",     kind: cursed, min_rarity: rare,
                      effects: [{stat: power_potency, pct: 20}], drawbacks: [{stat: impact_stun, pct: 15}]}
    gamblers_luck:   {name: "Gambler's Luck", desc: "Luckier finds, but a smaller pickup range.", kind: cursed, min_rarity: rare,
                      effects: [{stat: luck, add: 0.05}], drawbacks: [{stat: pickup_radius, add: -0.4}]}
    clover:          {name: Four-leaf Clover, desc: "Luck: enemies drop rarer eggs.", kind: flock,
                      effects: [{stat: egg_luck, add: 0.004}]}
    fame:            {name: Fame,            desc: "Fixed prestige for the flock: more score, rarer drops.",
                      kind: flock, effects: [{stat: prestige_bonus, add: 0.4}]}
    legend:          {name: Legend,          desc: "Multiplies the whole prestige of the flock.", kind: flock,
                      min_rarity: epic, effects: [{stat: prestige_mult, pct: 5}]}
    second_chance:   {name: Second Chance,   desc: "One more egg reroll for this run.", kind: flock,
                      min_rarity: rare, effects: [{rerolls: 1, scale: false}]}
    escape_hatch:    {name: Escape Hatch,    desc: "One more egg skip for this run.", kind: flock,
                      min_rarity: uncommon, max_rarity: rare, effects: [{skips: 1, scale: false}]}
    more_choices:    {name: Wider Nest, desc: "Every egg offers one more card.",      kind: flock, min_rarity: epic,
                      effects: [{stat: choices, add: 1, scale: false}]}
    lucky_nest:      {name: Lucky Nest, desc: "Enemies drop rarer eggs.",      kind: flock, min_rarity: rare, effects: [{stat: egg_luck, add: 0.008}]}

# =============================================================================
# PACTS
# =============================================================================
# After every biome boss the game stops and offers some of that boss's pacts
# (a permanent bonus with a permanent drawback), or refuse. Values are
# multiplied by intensity_by_boss, so later pacts are more extreme. Effects as
# for cards; {enemy: {stat: value}} changes every bat that spawns from then on
# (pct for multiplier stats such as hp_mult).
pacts:
  offered: 3
  intensity_by_boss: [1, 1.5, 2, 2.7, 3.5, 4.5]
  by_boss:
    1: [blood_oath, featherweight, greedy_nest, thick_skin, glass_cannon]
    2: [blood_oath, hunters_moon, iron_will, war_drums, tempest, featherweight]
    3: [greedy_nest, bat_plague, reaper, glass_cannon, midas]
    4: [hunters_moon, war_drums, wealth, tempest, iron_will, reaper]
    5: [bat_plague, midas, blood_oath, last_stand, wealth]
    6: [last_stand, glass_cannon, reaper, war_drums, bat_plague, midas]
  catalog:
    blood_oath:    {name: Blood Oath, desc: "Strike harder, fall faster.",    boon: [{stat: damage_mult, pct: 15}],
                    bane: [{stat: fall_speed_bonus, add: 2}]}
    featherweight: {name: Featherweight, desc: "Climb faster, but impacts stun longer.", boon: [{stat: rise_speed_bonus, add: 3}],
                    bane: [{stat: impact_stun, pct: 20}]}
    greedy_nest:   {name: Greedy Nest, desc: "Rarer eggs, tougher bats.",   boon: [{stat: egg_luck, add: 0.04}],
                    bane: [{enemy: {hp_mult: 10}}]}
    thick_skin:    {name: Thick Skin, desc: "Braver birds that climb more slowly.",    boon: [{stat: fear_resist, add: 0.1}],
                    bane: [{stat: rise_speed_bonus, add: -1.5}]}
    glass_cannon:  {name: Glass Cannon, desc: "Deadly crits, longer scares.",  boon: [{stat: crit_chance, add: 0.08}, {stat: crit_damage, add: 0.3}],
                    bane: [{stat: fear_duration_mult, pct: 15}]}
    hunters_moon:  {name: "Hunter's Moon", desc: "Hunt elites: more of them, better drops.", boon: [{stat: vs_elites, add: 0.2}, {stat: egg_luck, add: 0.015}],
                    bane: [{stat: elite_chance, add: 0.03}]}
    iron_will:     {name: Iron Will, desc: "Ignore scares, hit softer.",     boon: [{stat: fear_immunity, add: 0.08}],
                    bane: [{stat: damage_mult, pct: -6}]}
    war_drums:     {name: War Drums, desc: "Stronger, longer powers; scarier bats.",     boon: [{stat: power_potency, pct: 15}, {stat: power_duration, pct: 15}],
                    bane: [{enemy: {fear_strength: 10}}]}
    tempest:       {name: Tempest, desc: "Everything moves faster, up and down.",       boon: [{stat: rise_speed_bonus, add: 3}],
                    bane: [{stat: fall_speed_bonus, add: 3}]}
    bat_plague:    {name: Bat Plague, desc: "More XP and score from tougher, more numerous elites.",    boon: [{stat: xp_gain, pct: 20}, {stat: score_mult, pct: 15}],
                    bane: [{enemy: {hp_mult: 12}}, {stat: elite_chance, add: 0.03}]}
    reaper:        {name: Reaper, desc: "Cut through armor, reach less far.",        boon: [{stat: armor_pierce, add: 5}],
                    bane: [{stat: pickup_radius, add: -0.3}]}
    midas:         {name: Midas, desc: "Gold and luck at the cost of damage.",         boon: [{stat: score_mult, pct: 25}, {stat: luck, add: 0.03}],
                    bane: [{stat: damage_mult, pct: -8}]}
    wealth:        {name: Wealth, desc: "Fortune favours you; bats grow thicker skin.",        boon: [{stat: luck, add: 0.05}, {stat: egg_luck, add: 0.02}],
                    bane: [{enemy: {defense: 4}}]}
    last_stand:    {name: Last Stand, desc: "Birds may survive the floor, but fight worse.",    boon: [{stat: floor_save, add: 0.05}],
                    bane: [{stat: damage_mult, pct: -5}, {stat: fear_duration_mult, pct: 8}]}


# =============================================================================
# ACHIEVEMENTS (src/engine/meta.py, docs/progression.md)
# =============================================================================
# run: goals for one run, paid every run they are met.
# global: goals over every run played, paid once.
# all: {counter: minimum}, most: {counter: maximum}. Counters: level, score,
# bats, elites, mini_bats, bosses, eggs, rare_eggs, epic_eggs, legendary_eggs,
# mythical_eggs, hatched, pacts, swaps, powers, double_powers, battery_shots,
# full_charges, birds_lost (global ones also: runs).
achievements:
  run:
    first_steps:    {name: First Steps,       desc: Reach level 1-2,                  gold: 2,  all: {level: 2}}
    forest_edge:    {name: Forest Edge,       desc: Reach level 1-3,                  gold: 3,  all: {level: 3}}
    borderlands:    {name: Borderlands,       desc: Reach the second world,           gold: 5,  all: {level: 4}}
    border_keeper:  {name: Border Keeper,     desc: Reach level 2-3,                  gold: 8,  all: {level: 6}}
    beyond:         {name: Beyond the Border, desc: Reach the third world,            gold: 15, all: {level: 7}}
    deep_woods:     {name: Deep Woods,        desc: Reach the fourth world,           gold: 20, all: {level: 10}}
    swamp_walker:   {name: Swamp Walker,      desc: Reach the fifth world,            gold: 25, all: {level: 13}}
    cave_diver:     {name: Cave Diver,        desc: Reach the last world,             gold: 30, all: {level: 16}}
    summit:         {name: Summit,            desc: Reach level 6-3,                  gold: 40, all: {level: 18}}
    first_boss:     {name: Boss Down,         desc: Defeat a boss,                    gold: 5,  all: {bosses: 1}}
    two_bosses:     {name: Double Trouble,    desc: Defeat two bosses in a run,       gold: 10, all: {bosses: 2}}
    four_bosses:    {name: Boss Rush,         desc: Defeat four bosses in a run,      gold: 20, all: {bosses: 4}}
    all_bosses:     {name: Lord of the Skies, desc: Defeat six bosses in a run,       gold: 40, all: {bosses: 6}}
    pest_control:   {name: Pest Control,      desc: Kill 25 bats in a run,            gold: 4,  all: {bats: 25}}
    exterminator:   {name: Exterminator,      desc: Kill 75 bats in a run,            gold: 8,  all: {bats: 75}}
    bat_plague:     {name: Plague Doctor,     desc: Kill 150 bats in a run,           gold: 15, all: {bats: 150}}
    elite_hunter:   {name: Elite Hunter,      desc: Kill an elite bat,                gold: 4,  all: {elites: 1}}
    elite_slayer:   {name: Elite Slayer,      desc: Kill 5 elite bats in a run,       gold: 10, all: {elites: 5}}
    rare_find:      {name: Rare Find,         desc: Open a rare egg,                  gold: 2,  all: {rare_eggs: 1}}
