# BVB (Birds vs Bats) - Configuration File
# Copy this file to 'config.yml' and customize as needed
# Use --config path/to/config.yml to load a custom configuration
#
# All values shown are the defaults. You can override any value by
# uncommenting it and changing the value.
#
# Note: The structure must match the namespace structure in constants.py

layout:
  height: 30
  lane_positions: [5, 9, 13, 17, 21, 25, 29, 33, 37]
  max_lane_index: 8
  min_lane_index: 0
  num_balls: 9
  num_lanes: 9
  starting_line: 26
  width: 45
  # Aspect ratio for the entire screen (width:height)
  # Common values: "16:9" (widescreen), "4:3" (standard), "21:9" (ultrawide)
  # Terminal chars are ~2:1 (height is double width), this is accounted for
  aspect_ratio: "16:10"
  # Minimum panel width (content needs at least this much space)
  min_panel_width: 20

# Background rendering options
background:
  # Enable/disable background completely (the ^ tree pattern)
  enabled: true
  # Enable/disable parallax effect (the ∧ middle layer)
  # Only works if background.enabled is true
  parallax: false

birds:
  default_formation: [YELLOW, YELLOW, YELLOW, YELLOW, RED, RED, RED, BLUE, BLUE]
  randomize_lanes: true
  # Base damage (DMG) per bird type - used in damage formula
  damage:
    yellow: 1
    red: 1
    blue: 1
    patchwork: 1
    purple: 1
    clockwork: 1
    white: 2
    orange: 999  # One-hit kill
    gold: 0
    cookie: 1
    stealth: 8
    dinosaur: 5
    glitch: 1  # Glitch uses random multiplier
  # Base speed (SPD) per bird type
  speed:
    yellow: 2
    red: 3
    blue: 4
    patchwork: 3
    purple: 3
    clockwork: 2
    white: 4
    orange: 5
    gold: 6
    cookie: 3
    stealth: 3
    dinosaur: 4
    glitch: 3
timing:
  base_sleep: 0.2
  frame_sleep_level_multiplier: 0.88
  min_sleep: 0.02
  # Audio sync interval (frames)
  audio_sync_interval: 60

# Combat and scoring parameters
combat:
  # Score/XP multipliers for destroying enemies
  obstacle_destroy_xp_per_tier: 5    # XP = tier * this value
  obstacle_destroy_score_per_tier: 50  # Score = tier * this value
  bat_destroy_xp_per_tier: 5         # XP = tier * this value
  # Scared effect duration (seconds)
  scared_duration: 2.0
  # Speed boost duration when hit by high tier bat (seconds)
  speed_boost_duration: 2.0
  speed_boost_min_tier: 3            # Minimum bat tier to trigger speed boost
  # Damage formula: ((gear - gear_offset) * gear_coeff + dmg) * spd
  damage_formula:
    gear_offset: 3
    gear_coefficient: 0.1
  # Stealth bird tangible damage boost
  stealth_tangible_dmg_boost: 4
  # Glitch bird random damage multiplier range
  glitch_dmg_multiplier_min: 1
  glitch_dmg_multiplier_max: 8
  # Legacy combat values
  bat_center_offset: 4
  obstacle_score_multiplier: 2
  xp_bonus_per_tier: 10

# Loot and rarity
loot:
  # Base rarity weights [common, uncommon, rare, epic]
  base_rarity_weights: [60, 25, 10, 5]
  # Glitch bird special loot interactions
  glitch_ignore_chance: 0.05         # Chance to ignore loot
  glitch_promote_chance: 0.10        # Chance to promote rarity (cumulative with ignore)
  # Despawn times (seconds)
  bat_despawn_time: 60
  loot_despawn_time: 30
  # Gold bird score per tick
  gold_bird_score_per_tick: 100
notifications:
  duration_seconds: 3.0
  max_stack: 3
limits:
  max_entities: 50
physics:
  speed_max: 6
  speed_min: 1
eggs:
  drop_probs:
    0: 0.0
    1: 0.25
    2: 0.35
    3: 0.45
    4: 0.55
  rarity_candidates:
    common:
      yellow_egg: 30
      red_egg: 25
      blue_egg: 20
      patchwork_egg: 15
      purple_egg: 10
    uncommon:
      blue_egg: 33
      patchwork_egg: 25
      purple_egg: 20
      clockwork_egg: 12
      stealth_egg: 7
      cookie_egg: 3
    rare:
      white_egg: 34
      orange_egg: 33
      gold_egg: 33
    epic:
      dinosaur_egg: 50
      glitch_egg: 50
  rarity_weights:
    common:
      yellow_egg: 30
      red_egg: 25
      blue_egg: 20
      patchwork_egg: 15
      purple_egg: 10
    uncommon:
      blue_egg: 33
      patchwork_egg: 25
      purple_egg: 20
      clockwork_egg: 12
      stealth_egg: 7
      cookie_egg: 3
    rare:
      white_egg: 34
      orange_egg: 33
      gold_egg: 33
    epic:
      dinosaur_egg: 50
      glitch_egg: 50
bat_enemy:
  hp_by_tier:
    0: 16      # Mini bat (tier 0) - hides in obstacles
    1: 24      # era 16 (+50%)
    2: 48      # era 32 (+50%)
    3: 96      # era 64 (+50%)
    4: 192     # era 128 (+50%)
  loot_base_weights:
    0: [80, 15, 5, 0]   # Mini bat - mostly common loot
    1: [60, 25, 10, 5]
    2: [50, 30, 15, 5]
    3: [40, 33, 17, 10]
    4: [35, 25, 20, 15]
  max_on_screen: 5    # era 3 - più pipistrelli contemporaneamente
  scared:
    base_seconds: 2.0
    speed_boost_seconds: 2.0
  spawn_interval_range: [80, 160]  # era [120, 220] - spawn più frequente
  # Mini bat (tier 0) spawn settings - spawns from tier 3+ obstacles
  mini_bat:
    min_level: 2                   # Minimum game level for mini bats to spawn (1-18)
    min_obstacle_tier: 3           # Minimum obstacle tier that can hide mini bats
    min_y_fraction: 0.25           # Obstacle must be at least this far down screen (0.0=top, 1.0=bottom)
    anim_frames_per_step: 2        # Animation speed
    # Spawn probability per level range (chance when tier 3+ obstacle is hit)
    spawn_probability_by_level:
      level_1_3: 1              # 10% - rare at early levels
      level_4_6: 0.20              # 20%
      level_7_9: 0.30              # 30%
      level_10_12: 0.40            # 40%
      level_13_15: 0.50            # 50%
      level_16_18: 0.60            # 60% - common at high levels
  # Jumpscare bat settings - rare mini bat variant with scary face attack
  jumpscare_bat:
    spawn_chance: 1                # 15% chance to spawn jumpscare instead of mini bat
    visible_duration: 3.0          # Seconds to stay visible before hiding again
    scary_face_duration: 0.5       # Seconds to show scary face
    fear_duration: 2.0             # Base fear duration in seconds
    affected_lanes: 3              # Number of lanes affected by scary face (centered on bat)    random_scream_chance: 0.02     # 2% chance per frame to do random scream while active  # Armored bat settings - heavier variant that appears from tier 2+
  armored:
    min_tier: 2                    # Only tier 2+ bats can be armored
    despawn_time: 150              # 2.5 minutes (normal is 60s)
    movement_speed_mult: 0.6       # Move 40% slower than normal
    movement_range_mult: 0.7       # Move 30% less distance
    # Damage reduction per tier (subtracted from damage)
    damage_reduction_by_tier:
      2: 1
      3: 1
      4: 2
    # Additional scare effect when hit by armored bat
    scare_speed_bonus: 1           # +1 speed boost
    scare_bonus_duration: 1.0      # 1 second extra
    # Spawn probability per level range (chance that a tier 2+ bat spawns armored)
    spawn_probability_by_level:
      level_1_3: 0.00              # No bats yet
      level_4_6: 0.05              # 5% - very rare early
      level_7_9: 0.10              # 10%
      level_10_12: 0.15            # 15%
      level_13_15: 0.20            # 20%
      level_16_18: 0.25            # 25% - more common late game
  # Diver bat settings - bats that dive down at high speed
  diver:
    min_tier: 1                    # All tiers can be divers
    # Y position range (fraction of screen height) - stays in upper half
    # Early levels: closer to ceiling, later levels: closer to middle
    y_range_by_level:
      level_1_3: {min: 0.05, max: 0.20}   # Very high (5-20% from top)
      level_4_6: {min: 0.08, max: 0.25}   # High (8-25%)
      level_7_9: {min: 0.10, max: 0.30}   # Upper (10-30%)
      level_10_12: {min: 0.12, max: 0.35} # Upper-mid (12-35%)
      level_13_15: {min: 0.15, max: 0.40} # Mid-upper (15-40%)
      level_16_18: {min: 0.18, max: 0.45} # Closer to middle (18-45%)
    # Dive settings
    dive_probability_per_second: 0.20    # 20% chance per second to start dive
    dive_speed: 2                        # Moves down every N frames (faster than obstacles)
    dive_distance: 10                    # Max rows to dive before returning
    # Stun settings (after dive ends)
    stun_duration: 1.5                   # Seconds stunned after dive
    return_speed: 6                      # Frames between return steps (slower rise)
    # Collision effect during dive
    dive_boost_speed: 1                  # +1 fall speed when hit during dive
    dive_boost_duration: 0.5             # Duration of boost effect
    # Spawn probability per level range (chance that a bat spawns as diver)
    spawn_probability_by_level:
      level_1_3: 0.00              # No bats yet
      level_4_6: 0.08              # 8% - rare early
      level_7_9: 0.12              # 12%
      level_10_12: 0.16            # 16%
      level_13_15: 0.20            # 20%
      level_16_18: 0.25            # 25% - common late game
  # Spellcaster bat settings - bats that cast spells
  spellcaster:
    min_tier: 2                    # Only tier 2+ bats can be spellcasters
    # Number of spells known by tier
    spells_by_tier:
      2: 1                         # Tier 2: knows 1 spell (silence)
      3: 2                         # Tier 3: knows 2 spells (silence, repugnant wind)
      4: 3                         # Tier 4: knows all 3 spells
    # Spell cast probability per second (increases with level)
    cast_probability_by_level:
      level_1_3: 0.00
      level_4_6: 0.10              # 10% per second
      level_7_9: 0.15              # 15%
      level_10_12: 0.20            # 20%
      level_13_15: 0.25            # 25%
      level_16_18: 0.30            # 30%
    # Cooldown between spell casts (seconds)
    cast_cooldown: 3.0
    # Casting animation duration (seconds)
    casting_duration: 0.5
    # Spell durations by tier (seconds)
    silence:
      duration_by_tier:
        2: 3.0
        3: 4.0
        4: 5.0
    repugnant_wind:
      duration_by_tier:
        3: 3.0
        4: 4.5
      speed_boost: 1               # +1 fall speed
      speed_nerf: 1                # -1 rise speed
    exile:
      # No duration - instant effect
      swap_delay: 0.3              # Seconds before swap happens
    # Spawn probability per level range (chance that a tier 2+ bat spawns as spellcaster)
    spawn_probability_by_level:
      level_1_3: 0.00              # No bats yet
      level_4_6: 0.05              # 5% - very rare early
      level_7_9: 0.08              # 8%
      level_10_12: 0.12            # 12%
      level_13_15: 0.15            # 15%
      level_16_18: 0.20            # 20% - more common late game
  # Spawn rate per level range (frames between spawns)
  spawn_rate_by_level:
    level_4_6: 200
    level_7_9: 150
    level_10_12: 100
    level_13_15: 70
    level_16_18: 50
  # Max bats on screen per level range
  max_bats_by_level:
    level_4_6: 1
    level_7_9: 2
    level_10_12: 3
    level_13_15: 4
    level_16_18: 5
  # Tier weights per level range [tier1, tier2, tier3, tier4]
  # Note: Tier 0 (mini bats) spawn from obstacles, not directly - see mini_bat config
  tier_weights_by_level:
    level_1_3: [0, 0, 0, 0]        # No bats yet
    level_4_6: [70, 25, 5, 0]
    level_7_9: [50, 35, 12, 3]
    level_10_12: [30, 40, 22, 8]
    level_13_15: [15, 35, 35, 15]
    level_16_18: [5, 25, 45, 25]
  # Target Y position ranges per level (how close bats fly to birds)
  target_y_by_level:
    level_4_6: {min: 3, max: 8}
    level_7_9: {min: 5, max: 12}
    level_10_12: {min: 8, max: 16}
    level_13_15: {min: 10, max: 20}
    level_16_18: {min: 12, max: 23}
  spawning:
    consecutive_retry_timer: 20
    consecutive_spawn_limit: 2
    fail_retry_timer: 50
    level_threshold: 5
    max_attempts: 20
    min_separation: 15
    target_y_high_level:
      max: 22
      min: 18
    target_y_low_level:
      max: 12
      min: 10
    wave_offset:
      max: 10
      min: 0
    x_margin: 9
    x_min: 1
    y_start: 1
  tiers:
    hp_tier_1: 24      # era 16
    hp_tier_2: 48      # era 32
    hp_tier_3: 96      # era 64
    hp_tier_4: 192     # era 128
    level_threshold_1: 2
    level_threshold_2: 4
    level_threshold_3: 7
    weights_level_0_2: [60, 25, 10, 5]   # più tier alti prima
    weights_level_3_4: [40, 35, 18, 7]
    weights_level_5_7: [25, 35, 28, 12]
    weights_level_8_plus: [10, 25, 40, 25]  # tier 3 e 4 molto più comuni
# Boss configuration - end of biome bosses
boss:
  # HP for the boss (high HP, requires sustained effort)
  hp: 100
  # Armor reduction (subtracted from each hit)
  armor_reduction: 1
  # Scream attack settings
  scream:
    probability_per_second: 0.15    # Chance per second to scream
    cooldown_seconds: 3.0           # Minimum time between screams
    scare_duration: 1               # Fear effect duration (like tier 1 bat)
  # Movement settings
  descent_speed: 8                  # Frames between descent steps
  oscillation_range: 2              # Max columns to move left/right (subtle movement)
  oscillation_speed: 12             # Frames between oscillation steps
  # Score and XP rewards
  score: 1000
  xp: 100
  # Spawn timing - boss spawns when this many miles remain before level transition
  spawn_miles_before_transition: 1  # Very close to transition
  # Which levels have bosses (end of each biome = x-3 levels)
  boss_levels: [3, 6, 9, 12, 15, 18]  # 1-3, 2-3, 3-3, 4-3, 5-3, 6-3
  # Boss corpse obstacle settings (after death, becomes falling obstacle)
  corpse:
    hp: 64                          # HP for the falling dead boss
  # Loot settings (drops when boss dies)
  loot:
    count: 3                        # Number of items to drop
    tier: 3                         # Use tier 3 loot weights

# Wind Boss configuration - boss for level 2-3 (The Borders)
wind_boss:
  level: 6                          # Which level this boss appears (2-3 = level 6)
  hp: 300                           # Slightly more HP than regular boss
  armor_reduction: 1
  # Animation timing
  anim_frames_per_step: 8           # Frames between animation steps
  # Wind effects - intensity grows each frame
  # Tailwind: starts at max_down (frame 5), grows until pull_up_4 (frame 9)
  tailwind:
    up_bonus_min: 2                 # Starting bonus at max_down
    up_bonus_max: 5                 # Max bonus at pull_up_4
    down_penalty_min: 2             # Starting penalty at max_down
    down_penalty_max: 5             # Max penalty at pull_up_4
  # Headwind: starts at max_up (frame 0), grows until push_down_4 (frame 4)
  headwind:
    up_penalty_min: 2               # Starting penalty at max_up
    up_penalty_max: 4               # Max penalty at push_down_4
    down_bonus_min: 2               # Starting bonus at max_up
    down_bonus_max: 5               # Max bonus at push_down_4
  # Movement settings
  descent_speed: 8
  oscillation_range: 2
  oscillation_speed: 12
  # Rewards
  score: 1200
  xp: 120

# Jelly Boss configuration - boss for level 3-3 (Rotten Marshes)
jelly_boss:
  level: 9                            # Which level this boss appears (3-3 = level 9)
  spawn_miles_before_transition: 1    # Spawn 1 mile before level end (like wind boss)
  hp: 400                             # Higher HP
  armor_reduction: -1                 # Less armor (takes more damage)
  # Position - settles at 1/4 from top
  target_y_fraction: 0.25             # Fraction of screen height from top
  # Animation timing (10 frames, 1 fps = 10 seconds per cycle)
  anim_frames_per_step: 5             # 5 game frames per animation frame (at ~5fps = 1s)
  # Bat spawning
  spawn_frame: 8                      # Spawn bat on frame 8 (1-indexed)
  max_spawned_bats: 5                 # Maximum bats that can be spawned
  spawn_anim_duration: 0.5            # Seconds for spawn animation
  # Movement settings
  descent_speed: 8
  oscillation_range: 10               # Wide oscillation (left/right)
  oscillation_speed: 5                # Faster oscillation
  # Rewards
  score: 1500
  xp: 150
  # Corpse settings
  corpse:
    hp: 80

# Tree Boss configuration - boss for level 4-3 (Dark Swamp)
# Giant tree spanning entire screen with tangible branches
tree_boss:
  level: 12                           # Which level this boss appears (4-3 = level 12)
  spawn_miles_before_transition: 3   # Spawn 3 miles before level end
  stop_offset: -2                    # Tree stops N rows from top (negative = higher up)

  # Branch settings (5 foreground tangible branches)
  branches:
    base_hp: 30                       # HP per branch
    # Positions as fractions of screen (x_frac, y_frac from top-left)
    # y_frac max 0.45 to keep branches in upper half of screen
    positions:
      - {x_frac: 0.15, y_frac: 0.15}  # Upper left
      - {x_frac: 0.75, y_frac: 0.12}  # Upper right
      - {x_frac: 0.45, y_frac: 0.28}  # Middle center
      - {x_frac: 0.20, y_frac: 0.40}  # Lower left
      - {x_frac: 0.70, y_frac: 0.35}  # Lower right

    # Effects when bird hits a branch
    on_hit:
      stun_duration: 1.0              # Seconds bird can't be bounced after hit
      fall_boost_duration: 1.0        # +1 fall speed for 1 second
      fall_boost_speed: 1
      jumpscare_probability: 0.02     # 2% chance to spawn jumpscare bat

  # Flower settings (grow on branches)
  flowers:
    grow_interval: 2.0                # Seconds per growth frame (6 frames = 12s to mature)
    hp: 30                            # Flower HP (destroyed before branch takes damage)
    respawn_delay: 2.0                # Seconds before new flower starts growing

    # Red flower: BLEED effect - countdown timer, each UP press costs a life
    red:
      probability: 0.6                # 60% chance to bleed on hit
      bleed_duration: 3.0             # Seconds until bleed wears off (bird survives)
      speed_penalty: 2                # -2 speed while bleeding
      lives: 2                        # UP presses before death

    # Yellow flower: STUN effect - bird falls slowly, can't bounce
    yellow:
      probability: 0.6                # 60% chance to stun on hit
      stun_duration: 3.0              # Seconds bird is stunned
      speed_penalty: 3                # -3 speed while stunned

    # Blue flower: FREEZE effect - bird stuck in place, mash button to thaw
    blue:
      probability: 0.6                # 60% chance to freeze on hit
      thaw_attempts_min: 3            # Minimum button presses to thaw
      thaw_attempts_max: 5            # Maximum button presses to thaw

    # Green flower: POISON effect - countdown to death, mash button to cure
    green:
      probability: 0.6                # 60% chance to poison on hit
      poison_duration: 7.0           # Seconds until bird dies if not cured
      cure_attempts_min: 2            # Minimum button presses to cure
      cure_attempts_max: 4            # Maximum button presses to cure
      speed_penalty: 1                # -1 speed while poisoned

  # Rewards
  score: 2000
  xp: 200

# Swamp obstacle flowers - Dark Swamp (biome 4) obstacles can bloom flowers
swamp_flowers:
  bloom_probability: 0.5            # 50% chance per obstacle to have a flower
  # Uses same flower types and effects as tree_boss.flowers

obstacle:
  # Base HP per tier (before level scaling)
  hp_by_tier:
    1: 5
    2: 8
    3: 16
    4: 32
  # HP scaling with level: hp = base_hp * (1 + (level-1) * level_hp_multiplier)
  level_hp_multiplier: 0.1
  # Legacy max_hp_by_tier for render color calculation
  max_hp_by_tier:
    1: 4
    2: 6
    3: 12
    4: 27
  spawning:
    # Spawn rate formula: biome_base * (biome_decay ^ level_group) * (sublevel_decay ^ (sub_level-1))
    biome_base: 40           # Base spawn rate
    biome_decay: 0.85        # Multiplier per biome (lower = faster spawn in later biomes)
    sublevel_decay: 0.9      # Multiplier per sub-level (lower = faster spawn in later sub-levels)
    min_spawn_rate: 6        # Minimum frames between spawns
    consecutive_spawn_limit: 3
    retry_timer_divisor: 2
    retry_timer_min: 3
  # Tier weights per level range [tier1, tier2, tier3, tier4]
  tier_weights:
    level_1_3: [60, 28, 10, 2]    # Levels 1-1 to 1-3
    level_4_6: [45, 35, 15, 5]    # Levels 2-1 to 2-3
    level_7_9: [30, 35, 25, 10]   # Levels 3-1 to 3-3
    level_10_12: [20, 35, 30, 15] # Levels 4-1 to 4-3
    level_13_15: [10, 30, 38, 22] # Levels 5-1 to 5-3
    level_16_18: [5, 20, 45, 30]  # Levels 6-1 to 6-3
