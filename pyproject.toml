# Packaging (pip install birds-vs-bats) and tooling. The runtime dependencies are also in
# requirements.txt, for running from the sources.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "birds-vs-bats"
dynamic = ["version"]
description = "BVB - Bird vs Bat: an arcade roguelike in the terminal (or in a window), with a music that follows your flock"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "numpy>=1.24",
    "pygame-ce>=2.5",
]
keywords = ["game", "terminal", "roguelike", "arcade", "ascii"]
classifiers = [
    "Environment :: Console",
    "Topic :: Games/Entertainment :: Arcade",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Onheiron/PY-birds-vs-bats"

[project.scripts]
bvb = "birds_vs_bats.__main__:main"
birds-vs-bats = "birds_vs_bats.__main__:main"

[tool.hatch.version]
path = "src/__init__.py"

# The wheel holds one package, birds_vs_bats: the launcher, and the game laid out as in the repository
[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"packaging/pip/birds_vs_bats/__init__.py" = "birds_vs_bats/__init__.py"
"packaging/pip/birds_vs_bats/__main__.py" = "birds_vs_bats/__main__.py"
"game.py" = "birds_vs_bats/game.py"
"src" = "birds_vs_bats/src"
"media/music" = "birds_vs_bats/media/music"
"media/fonts" = "birds_vs_bats/media/fonts"
"media/icons/bvb_256.png" = "birds_vs_bats/media/icons/bvb_256.png"
"config.yml" = "birds_vs_bats/config.yml"
"config_easy.yml" = "birds_vs_bats/config_easy.yml"
"config_hard.yml" = "birds_vs_bats/config_hard.yml"
"config_hell.yml" = "birds_vs_bats/config_hell.yml"
"hardmode.yml" = "birds_vs_bats/hardmode.yml"
"config.sample.yml" = "birds_vs_bats/config.sample.yml"
"config.schema.json" = "birds_vs_bats/config.schema.json"
"theme.yml" = "birds_vs_bats/theme.yml"
"theme_accessible.yml" = "birds_vs_bats/theme_accessible.yml"
"CHANGELOG.md" = "birds_vs_bats/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/game.py", "/media/music", "/media/fonts", "/media/icons/bvb_256.png", "/packaging/pip", "/README.md",
    "/config*.yml", "/config.schema.json", "/CHANGELOG.md", "/hardmode.yml", "/theme*.yml", "/requirements*.txt",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "UP",   # modern syntax
    "B",    # likely bugs
    "C4",   # comprehensions
    "PIE",  # needless code
    "RET",  # return style
    "SIM",  # simplifications
]
ignore = [
    "SIM102",  # nested ifs often mirror the game rules more clearly
    "SIM108",  # ternaries are not always more readable
    "B905",    # zip() over lists that are equal-length by construction
    "RET505",  # elif/else after return keeps rule tables symmetrical
]

[tool.ruff.lint.per-file-ignores]
# Hand-laid note tables and achievement lists: long lines and music notation names (l = low octave)
"src/services/synth.py" = ["E501", "E741"]
"src/services/achievements.py" = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "preserve"
# Data-heavy modules (note tables, achievement lists) are laid out by hand
exclude = ["src/services/synth.py", "src/services/achievements.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/services/audio.py", "src/services/synth.py", "src/services/music_engine.py", "src/services/online.py"]
