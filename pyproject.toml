# Tooling configuration. Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "UP",   # modern syntax
    "B",    # likely bugs
    "C4",   # comprehensions
    "PIE",  # needless code
    "RET",  # return style
    "SIM",  # simplifications
]
ignore = [
    "SIM102",  # nested ifs often mirror the game rules more clearly
    "SIM108",  # ternaries are not always more readable
    "B905",    # zip() over lists that are equal-length by construction
    "RET505",  # elif/else after return keeps rule tables symmetrical
]

[tool.ruff.lint.per-file-ignores]
# Hand-laid note tables and achievement lists: long lines and music notation names (l = low octave)
"src/services/audio.py" = ["E501", "E741"]
"src/services/achievements.py" = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "preserve"
# Data-heavy modules (note tables, achievement lists) are laid out by hand
exclude = ["src/services/audio.py", "src/services/achievements.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/services/audio.py", "src/services/music_engine.py", "src/services/firebase_client.py"]
