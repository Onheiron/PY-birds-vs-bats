# BVB (Birds vs Bats) - Sample custom configuration
#
# Copy this file, change what you like and run:
#
#   python3 game.py --config my_config.yml
#
# A custom configuration only needs the values it changes: it is merged over
# the defaults in config.yml, which is the complete, commented reference of
# every setting. Section and key names must match config.yml (unknown section
# names are rejected at startup).

birds:
  # Starting flock, one bird per lane (see src/entities/bird_types.py for all types)
  default_formation: [YELLOW, YELLOW, YELLOW, YELLOW, RED, RED, RED, BLUE, BLUE]
  randomize_lanes: true           # Shuffle which lane each bird starts in

layout:
  aspect_ratio: "16:10"           # Target screen shape; side panels grow to fill it
  min_panel_width: 20

background:
  enabled: true                   # Scrolling scenery behind the game area
  parallax: false                 # Second, faster scenery layer

bat_enemy:
  max_on_screen: 5                # Bats alive at the same time
  spawn_interval_range: [80, 160] # Game frames between spawns (lower = more bats)

speed:
  mph_per_level: 40               # Miles per hour gained with each gear
  starting_momentum: 100

game:
  life_recovery_on_spawn: true    # Hatching a new bird gives a life back
