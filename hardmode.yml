# BVB (Birds vs Bats) - Hard mode preset
#
# A tougher ruleset to start from, roughly halfway between the default
# balance (config.yml, "ADVENTURE") and the LEGENDARY difficulty
# (config_hell.yml):
#
#   python3 game.py --config hardmode.yml
#
# Like every file passed with --config, this only lists the values that differ
# from config.yml: everything else keeps its default. The difficulty chosen on
# the title screen is applied on top of these values.

game:
  life_recovery_on_spawn: false   # Hatching a new bird no longer gives a life back

bat_enemy:
  # Tougher bats                    ADVENTURE / LEGENDARY
  hp_by_tier:
    1: 360      # 240 / 600
    2: 720      # 480 / 1200
    3: 1440     # 960 / 2400
    4: 2880     # 1920 / 4800
  # Bats per world (between ADVENTURE and LEGENDARY); a list replaces the whole of config.yml's, see
  # bat_enemy.worlds there for what each field means
  worlds:
    - {max_bats: 0, spawn_interval: 0, tiers: [0, 0, 0, 0], kinds: {}, height: [3, 8], dive_height: [0.05, 0.20], mini_bat: 0.15}
    - {max_bats: 4, spawn_interval: 85, tiers: [50, 35, 12, 3], kinds: {armored: 0.03, diver: 0.1},
       height: [3, 8], dive_height: [0.08, 0.25], mini_bat: 0.25}
    - {max_bats: 5, spawn_interval: 70, tiers: [35, 40, 20, 5], kinds: {armored: 0.1, diver: 0.12, spellcaster: 0.08, healer: 0.07},
       height: [5, 12], dive_height: [0.1, 0.3], mini_bat: 0.35}
    - {max_bats: 6, spawn_interval: 65, tiers: [20, 35, 30, 15], kinds: {armored: 0.12, diver: 0.14, spellcaster: 0.1, healer: 0.07, bomber: 0.1, plague: 0.08},
       height: [8, 16], dive_height: [0.12, 0.35], mini_bat: 0.45}
    - {max_bats: 7, spawn_interval: 50, tiers: [10, 25, 40, 25], kinds: {armored: 0.16, diver: 0.14, spellcaster: 0.11, healer: 0.09, bomber: 0.11, plague: 0.09, necromancer: 0.06},
       height: [10, 20], dive_height: [0.15, 0.4], mini_bat: 0.55}
    - {max_bats: 8, spawn_interval: 40, tiers: [3, 18, 42, 37], kinds: {armored: 0.2, diver: 0.14, spellcaster: 0.12, healer: 0.09, bomber: 0.11, plague: 0.11, necromancer: 0.09},
       height: [12, 23], dive_height: [0.18, 0.45], mini_bat: 0.65}

obstacle:
  spawning:
    biome_base: 30                # 40 / 20 - lower is more frequent
    biome_decay: 0.8              # 0.85 / 0.75
    sublevel_decay: 0.85          # 0.9 / 0.8
    min_spawn_rate: 4             # 6 / 2

progression:
  grade_exp_factor: 1.1           # 1.07 / 1.15 - grades need more XP
  level_score_factor: 1.1         # 1.08 - gears need more momentum

speed:
  momentum_zero_height: 0.45      # 0.33 / 0.6 - fly higher to keep momentum
