# BVB (Birds vs Bats) - Hard mode preset
#
# A tougher ruleset to start from, roughly halfway between the default
# balance (config.yml, "ADVENTURE") and the LEGENDARY difficulty
# (config_hell.yml):
#
#   python3 game.py --config hardmode.yml
#
# Like every file passed with --config, this only lists the values that differ
# from config.yml: everything else keeps its default. The difficulty chosen on
# the title screen is applied on top of these values.

game:
  life_recovery_on_spawn: false   # Hatching a new bird no longer gives a life back

bat_enemy:
  # Tougher bats                    ADVENTURE / LEGENDARY
  hp_by_tier:
    1: 36                         # 24  / 60
    2: 72                         # 48  / 120
    3: 144                        # 96  / 240
    4: 288                        # 192 / 480
  # More bats at once, by level range   ADVENTURE / LEGENDARY
  max_bats_by_level:
    level_4_6: 2                  # 1 / 3
    level_7_9: 3                  # 2 / 5
    level_10_12: 5                # 3 / 7
    level_13_15: 6                # 4 / 9
    level_16_18: 7                # 5 / 10
  # Game frames between bat spawns (lower = more frequent)
  spawn_rate_by_level:
    level_4_6: 140                # 200 / 80
    level_7_9: 105                # 150 / 60
    level_10_12: 75               # 100 / 45
    level_13_15: 50               # 70 / 30
    level_16_18: 35               # 50 / 20

obstacle:
  spawning:
    biome_base: 30                # 40 / 20 - lower is more frequent
    biome_decay: 0.8              # 0.85 / 0.75
    sublevel_decay: 0.85          # 0.9 / 0.8
    min_spawn_rate: 4             # 6 / 2

progression:
  grade_exp_factor: 1.1           # 1.07 / 1.15 - grades need more XP
  level_score_factor: 1.1         # 1.08 - gears need more momentum

speed:
  momentum_zero_height: 0.45      # 0.33 / 0.6 - fly higher to keep momentum
