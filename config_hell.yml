# BVB (Birds vs Bats) - LEGENDARY Difficulty Configuration
# Brutal difficulty but with better chances for rare/legendary birds
# Selected from the title screen (NEW GAME < difficulty >), or directly with:
#   python3 game.py --config config_hell.yml

# Only override values that differ from config.yml (ADVENTURE)

game:
  difficulty_name: "LEGENDARY"
  life_recovery_on_spawn: false  # NO life recovery when new birds spawn!

bat_enemy:
  # Massive HP - bats are bullet sponges
  hp_by_tier:
    1: 600      # ADVENTURE: 240
    2: 1200     # ADVENTURE: 480
    3: 2400     # ADVENTURE: 960
    4: 4800     # ADVENTURE: 1920
  # Bats per world (LEGENDARY: about twice ADVENTURE, faster, higher tiers); a list replaces the whole of config.yml's, see
  # bat_enemy.worlds there for what each field means
  worlds:
    - {max_bats: 0, spawn_interval: 0, tiers: [0, 0, 0, 0], kinds: {}, height: [3, 8], dive_height: [0.05, 0.20], mini_bat: 0.2}
    - {max_bats: 5, spawn_interval: 60, tiers: [40, 40, 15, 5], kinds: {armored: 0.05, diver: 0.15},
       height: [3, 8], dive_height: [0.08, 0.25], mini_bat: 0.3}
    - {max_bats: 7, spawn_interval: 50, tiers: [25, 40, 25, 10], kinds: {armored: 0.12, diver: 0.15, spellcaster: 0.1, healer: 0.08},
       height: [5, 12], dive_height: [0.1, 0.3], mini_bat: 0.4}
    - {max_bats: 8, spawn_interval: 45, tiers: [15, 30, 35, 20], kinds: {armored: 0.15, diver: 0.15, spellcaster: 0.12, healer: 0.08, bomber: 0.12, plague: 0.1},
       height: [8, 16], dive_height: [0.12, 0.35], mini_bat: 0.5}
    - {max_bats: 9, spawn_interval: 35, tiers: [5, 20, 45, 30], kinds: {armored: 0.18, diver: 0.15, spellcaster: 0.12, healer: 0.1, bomber: 0.12, plague: 0.1, necromancer: 0.08},
       height: [10, 20], dive_height: [0.15, 0.4], mini_bat: 0.6}
    - {max_bats: 10, spawn_interval: 25, tiers: [0, 10, 40, 50], kinds: {armored: 0.2, diver: 0.15, spellcaster: 0.12, healer: 0.1, bomber: 0.12, plague: 0.12, necromancer: 0.1},
       height: [12, 23], dive_height: [0.18, 0.45], mini_bat: 0.7}

obstacle:
  # Massive HP - obstacles are walls
  hp_by_tier:
    1: 120      # ADVENTURE: 50
    2: 240      # ADVENTURE: 80
    3: 480      # ADVENTURE: 160
    4: 960      # ADVENTURE: 320
  # HP scales faster with level
  level_hp_multiplier: 0.2   # ADVENTURE: 0.1
  # Relentless spawn rate
  spawning:
    biome_base: 20           # ADVENTURE: 40 (much lower = much faster spawn)
    biome_decay: 0.75        # ADVENTURE: 0.85
    sublevel_decay: 0.80     # ADVENTURE: 0.9
    min_spawn_rate: 2        # ADVENTURE: 6

# Eggs - rare/legendary birds are MORE common in LEGENDARY
# NOTE: the egg (and loot) tables below are NOT applied when the difficulty is
# picked from the title screen: they were written for the old four-rarity loot
# system and do not match the six rarities of config.yml. See DIFFICULTY_SECTIONS
# in src/core/constants.py.
eggs:
  rarity_candidates:
    common:
      yellow_egg: 20         # Less common birds
      red_egg: 20
      blue_egg: 20
      patchwork_egg: 20      # More special birds
      purple_egg: 20
    uncommon:
      blue_egg: 15
      patchwork_egg: 20
      purple_egg: 20
      clockwork_egg: 20      # More special birds
      stealth_egg: 15
      cookie_egg: 10
    rare:
      white_egg: 30
      orange_egg: 35
      gold_egg: 35           # More gold birds
    epic:
      dinosaur_egg: 50       # Equal chance for legendaries
      glitch_egg: 50


progression:
  # Glacial grade progression - birds barely level up
  grade_exp_factor: 1.15     # ADVENTURE: 1.07 (much higher = much slower leveling)

speed:
  # Sky-high momentum threshold - need to be in top third of screen
  momentum_zero_height: 0.60  # ADVENTURE: 0.33 (much higher = much harder)
