# BVB (Birds vs Bats) - LEGENDARY Difficulty Configuration
# Brutal difficulty but with better chances for rare/legendary birds
# Use with: python -m src.game --config config_hell.yml

# Only override values that differ from config.yml (ADVENTURE)

game:
  difficulty_name: "LEGENDARY"
  life_recovery_on_spawn: false  # NO life recovery when new birds spawn!

bat_enemy:
  # Massive HP - bats are bullet sponges
  hp_by_tier:
    1: 60      # ADVENTURE: 24
    2: 120     # ADVENTURE: 48
    3: 240     # ADVENTURE: 96
    4: 480     # ADVENTURE: 192
  # Swarm mode
  max_on_screen: 10   # ADVENTURE: 5
  # Relentless spawn rate
  spawn_interval_range: [30, 60]  # ADVENTURE: [80, 160]
  spawn_rate_by_level:
    level_4_6: 80     # ADVENTURE: 200
    level_7_9: 60     # ADVENTURE: 150
    level_10_12: 45   # ADVENTURE: 100
    level_13_15: 30   # ADVENTURE: 70
    level_16_18: 20   # ADVENTURE: 50
  max_bats_by_level:
    level_4_6: 3      # ADVENTURE: 1
    level_7_9: 5      # ADVENTURE: 2
    level_10_12: 7    # ADVENTURE: 3
    level_13_15: 9    # ADVENTURE: 4
    level_16_18: 10   # ADVENTURE: 5
  # Higher tier bats appear earlier
  tier_weights_by_level:
    level_4_6: [40, 40, 15, 5]     # ADVENTURE: [70, 25, 5, 0]
    level_7_9: [25, 40, 25, 10]    # ADVENTURE: [50, 35, 12, 3]
    level_10_12: [15, 30, 35, 20]  # ADVENTURE: [30, 40, 22, 8]
    level_13_15: [5, 20, 45, 30]   # ADVENTURE: [15, 35, 35, 15]
    level_16_18: [0, 10, 40, 50]   # ADVENTURE: [5, 25, 45, 25]
  tiers:
    hp_tier_1: 60
    hp_tier_2: 120
    hp_tier_3: 240
    hp_tier_4: 480

obstacle:
  # Massive HP - obstacles are walls
  hp_by_tier:
    1: 12      # ADVENTURE: 5
    2: 24      # ADVENTURE: 8
    3: 48      # ADVENTURE: 16
    4: 96      # ADVENTURE: 32
  # HP scales faster with level
  level_hp_multiplier: 0.2   # ADVENTURE: 0.1
  # Relentless spawn rate
  spawning:
    biome_base: 20           # ADVENTURE: 40 (much lower = much faster spawn)
    biome_decay: 0.75        # ADVENTURE: 0.85
    sublevel_decay: 0.80     # ADVENTURE: 0.9
    min_spawn_rate: 2        # ADVENTURE: 6

# Eggs - rare/legendary birds are MORE common in LEGENDARY
eggs:
  rarity_candidates:
    common:
      yellow_egg: 20         # Less common birds
      red_egg: 20
      blue_egg: 20
      patchwork_egg: 20      # More special birds
      purple_egg: 20
    uncommon:
      blue_egg: 15
      patchwork_egg: 20
      purple_egg: 20
      clockwork_egg: 20      # More special birds
      stealth_egg: 15
      cookie_egg: 10
    rare:
      white_egg: 30
      orange_egg: 35
      gold_egg: 35           # More gold birds
    epic:
      dinosaur_egg: 50       # Equal chance for legendaries
      glitch_egg: 50

  # Higher chance to get rare/epic eggs
  # Base weights: [common, uncommon, rare, epic]
  # ADVENTURE: [60, 25, 10, 5]
loot:
  base_rarity_weights: [40, 30, 18, 12]  # Much better rare/epic chances

progression:
  # Glacial grade progression - birds barely level up
  grade_exp_factor: 1.15     # ADVENTURE: 1.07 (much higher = much slower leveling)

speed:
  # Sky-high momentum threshold - need to be in top third of screen
  momentum_zero_height: 0.60  # ADVENTURE: 0.33 (much higher = much harder)
  # Brutally fast at high speeds
  frame_sleep_at_speed_1: 0.14    # ADVENTURE: 0.18
  frame_sleep_at_speed_10: 0.008  # ADVENTURE: 0.02 (insanely fast)
